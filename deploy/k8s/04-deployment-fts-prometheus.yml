apiVersion: apps/v1
kind: Deployment
metadata:
  name: fts-prometheus
  namespace: monitoring
  labels:
    app: fts-prometheus
    app.kubernetes.io/managed-by: fts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fts-prometheus
  template:
    metadata:
      labels:
        app: fts-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.50.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
          readOnly: true
        - name: prometheus-alerts
          mountPath: /etc/prometheus/rules
          readOnly: true
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: -/healthy
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: -/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: prometheus-config
        configMap:
          name: fts-prometheus-config
      - name: prometheus-alerts
        configMap:
          name: fts-prometheus-alerts
      - name: prometheus-data
        emptyDir: {}
