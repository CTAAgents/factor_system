apiVersion: v1
kind: ConfigMap
metadata:
  name: fts-prometheus-config
  namespace: monitoring
  labels:
    app: fts-prometheus
    app.kubernetes.io/managed-by: fts
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n \
    \ external_labels:\n    monitor: fts-monitor\n    environment: production\nrule_files:\n\
    - /etc/prometheus/rules/*.yml\nalerting:\n  alertmanagers:\n  - static_configs:\n\
    \    - targets:\n      - fts-alertmanager:9093\nscrape_configs:\n- job_name: fts-metrics\n\
    \  scheme: http\n  static_configs:\n  - targets:\n    - fts-production.fts.svc.cluster.local:9100\n\
    \    labels:\n      service: fts\n      component: core\n  metrics_path: /metrics\n\
    \  scrape_interval: 10s\n- job_name: fts-data-sources\n  scheme: http\n  static_configs:\n\
    \  - targets:\n    - fts-production.fts.svc.cluster.local:9100\n    labels:\n\
    \      service: fts\n      component: data_source\n  metrics_path: /metrics/data-sources\n\
    \  scrape_interval: 30s\n- job_name: fts-health\n  scheme: http\n  static_configs:\n\
    \  - targets:\n    - fts-production.fts.svc.cluster.local:9100\n    labels:\n\
    \      service: fts\n      component: health\n  metrics_path: /health\n  scrape_interval:\
    \ 10s\n"
