# FTS 全局配置
# 配置加载优先级: 环境变量 > YAML > 默认值

# ── 数据配置 ──
# 全局默认市场（v3.0.0+1 反转回 futures）：双系统切分后 FTS 为因子生产系统，默认工作市场为全部期货
# （84 品种/17 产业链，coverage_priority P0-P3），门控任务（_market_gate）据此切换执行集；
# 可用环境变量 FTS_DEFAULT_MARKET 覆盖（环境变量 > YAML > 默认值）
default_market: "futures"

# ── LLM 配置（因子演化用） ──
llm_backend: "openai"
# API Key 通过环境变量 OPENAI_API_KEY 设置
# API 端点通过环境变量 OPENAI_BASE_URL=https://api.deepseek.com/v1 设置
# 模型通过环境变量 OPENAI_MODEL=deepseek-chat 设置
# LLM 采样温度（0.0-2.0），调高可增加因子生成多样性；默认 1.2
llm_temperature: 1.2

# ── L1 提取器（plans/41 A3: max_factors 配置化，v2.104.0+71）──
# 单次 LLM 提取最大因子数（研报/论文/宏观/WebSearch 等 LLM 提取源；
# 天软 tinysoft 为静态 YAML 感知源，不调用 LLM，不参与该配额）
l1_extractor_max_factors: 20

# ── L1 拒绝候选复活（plans/44 C2，v2.104.0+83）──
# 每次运行 Step 2.75 扫描 l1_rejected_*，对编译失败候选规则/LLM 修复后重新验证注入
l1_rejected_retry: true

# ── 演化配置 ──
max_generations: 10
population_size: 20
micro_trials_per_generation: 50

# ── 演化模式 (Phase C.2) ──
# operator(算子主干) / operator_first(算子优先,LLM/GP兜底) / code(代码创新) / hybrid(混合)
# v2.105.0+2 起默认 operator_first：本地算子演化优先（零 token），LLM/GP 兜底，
# 控制云 API token 消耗（配合生成端去重前置 Step 1.35 减少重复评估算力）。
evolution_mode: "operator_first"

# ── L3 Portfolio ──
portfolio_max_factors: 20
portfolio_top_n: 5
portfolio_decay_days: 90
l2_panel_days: 750
# Q1-Q10 入库质检结论门禁（GAP-135）：晋升前校验 qa_review.q1_q10_passed，
# 结论「禁止入库/待综合评定」拒绝晋升；env FTS_L2_QA_GATE_ENABLED=false 关闭
l2_qa_gate_enabled: true

# ── L3 G1 同向敞口惩罚（35-gap-closure-plan G1）──
# 触发：因子 IC 同向权重占比 ≥ align_threshold（ic>0 看多 / ic<0 看空）
# compress_curve ∈ {linear, sqrt(更温和), exp(更激进)}
# 取值域: align_threshold ∈ (0,1]，max_compress ∈ (0,1]
# 2026-08-15 风控评审后放宽：max_compress 0.50→0.70（全多组合敞口压至 70%，较 0.50 敞口 +40%）
l3_g1_enabled: true
l3_g1_align_threshold: 0.60
l3_g1_max_compress: 0.70
l3_g1_compress_curve: "linear"

# ── L3 Verifier 配置 ──
# 口径说明（GAP-122，v2.104.0+42）：min_sharpe 判定组合信号质量，Verifier 校验
# 缩放前 signal_sharpe（见 portfolio_loop Step 6）；max_turnover 对齐因子月度换手
# 量纲（次/月，能源精英池均值区间 4.48~17.40，组合等权均值 ~11.6）。
# max_sharpe 上限（v2.104.0+73）：signal_sharpe 改用截断前 raw Sharpe 计算后，
# 信号质量上界由 2.0（SHARPE_CAP 截断值）提升至 raw 口径（精英池原始 Sharpe
# 区间 3.27~17.09，quality_weight 加权后实测 8.64），3.5 上限（按截断口径设计）
# 与 raw 口径不自洽会恒触发过拟合警告；校准至 12.0 过滤异常虚高（预留波动余量）。
verifier:
  min_sharpe: 1.9
  max_correlation: 0.5
  max_turnover: 12.0
  max_decay_rate: 0.30
  min_n_factors: 3
  max_sharpe: 12.0

# ── L3 因子选择与组合构建（plans/36，v2.104.0+43）──
l3:
  # 因子综合评分（替代裸 Sharpe 排序选入，改进项 2）
  factor_score:
    weights:
      sharpe_cap: 0.30   # cap 后 Sharpe（min(|sharpe|, SHARPE_CAP=2.0)）
      icir: 0.30         # IC 均值/IC 标准差（风险调整质量主指标）
      ic: 0.20           # |IC|
      turnover_inv: 0.20 # 低换手优先（-turnover，成本惩罚）
    # quality_weight 等权下限系数（默认 0.5×等权）：权重下限 = equal_weight_floor / N，
    # 防权重极端分化；提高系数（如 0.7）可提升权重分散度但会放大尾部因子暴露。
    equal_weight_floor: 0.5
  # P1 因子聚类（改进项 4）
  cluster:
    threshold: 0.7       # 层次聚类距离阈值（1-|corr|）
    top_n: 1             # 簇内保留代表数（2=允许簇内互补代表，需敏感性验证）
  # 子链维度去冗余（能源链专属，v2.105.0+13 升级为链内相关性聚类去冗余）：
  # 归链画像优先级：subchain_scope → symbol_ic 主导子链兜底 → unknown 通用池直接保留。
  # 链内用子链品种面板计算多品种平均信号相关 → 层次聚类（corr_threshold）→ 每簇留代表（cluster_top_n）
  # → 叠加 max_per_chain 数量上限。无画像/unknown 因子=全链通用因子直接进入组合（不做子链去冗余）。
  chain_dedup:
    enabled: true
    max_per_chain: 2     # 聚类后单子链保留因子数上限（防产业链暴露集中）
    corr_threshold: 0.5  # 链内聚类距离阈值（1-|corr|，收紧于全局 P1 的 0.7）
    cluster_top_n: 1     # 链内每簇保留代表数上限
  # L3 子链差异化权重调制（plans/47 §B，仅 market=energy 生效）：
  # 特异因子在无效子链降权/归零；enabled 默认 false=全链统一权重（兼容现状），
  # CLI --enable-subchain-weight 显式传参优先。decay_mode: zero=归零 / soft=按 |mean_ic| 相对缩放。
  # v2.105.0 起启用（未投产，架构已近目标；decay_mode=zero 激进模式）
  subchain_weight:
    enabled: true
    decay_mode: zero
    soft_min_ratio: 0.0
    scope_default: all
    max_exposure_ratio: 0.5   # 单子链暴露占比告警阈值（D2 监控）

  # 子链方向 Gate（plans/48 §A/§B，仅 market=energy 生效）：
  # 子链 regime 置信度不足 → avoid（hard=剔除 / soft=按 soft_avoid_ratio 降权）；
  # 盲测池等无子链归属品种默认回避。enabled 默认 false=现状（全局软票+方向偏置）。
  # exposure_min/exposure_sat：品种暴露缩放映射（§B1，置信度<min→0 / ≥sat→满仓 / 中间线性）。
  # v2.105.0 起启用（avoid_mode=hard 激进模式）
  regime_gating:
    enabled: true
    min_confidence: 0.55
    avoid_mode: hard
    soft_avoid_ratio: 0.3
    blind_default: avoid
    exposure_min: 0.4
    exposure_sat: 0.7

  # 因子×制度条件化权重（plans/53 §B，仅 market=energy 生效）：
  # 当前市场制度下 IC 显著为负（ic < -min_abs_ic）的因子权重归零/降权，
  # 避免"逆制度因子"拖累组合；regime_scope=all/unknown 或当前制度 effective → 全保留。
  # 与 Step 2.5 regime 倍率叠加（先倍率调权 → 再条件化）。
  # v2.105.0+9 实盘灰度开启；2026-08-17 用户决策：soft 相对基准（|ic|/max_ic）在
  # "当前制度 IC 恰为各制度最强"时 m=1.0 不降权（实测 3 因子），改用 zero 归零（激进）。
  regime_conditional:
    enabled: true
    decay_mode: zero
    soft_min_ratio: 0.0
    scope_default: all
    min_abs_ic: 0.05

  # 因子×子链质量矩阵（plans/49，QA/生命周期张量化；subchain_quality_store.py 参数化 SSOT）。
  # enabled=false 时评审/生命周期回退全链原逻辑（股票/无子链画像因子天然走回退）。
  # v2.105.0 起启用（2026-08-17 已回填 196 因子画像 + 784 行质量矩阵）
  subchain_quality:
    enabled: true
    decay_threshold: 0.30   # 有效链 IC 衰减触发阈值（最近窗 vs 早期基准 >30% 标记）
    drop_severe: 0.50       # 全部有效链衰减严重阈值（→ degrade）
    window_days: 60         # 退化检测滚动窗口（按评估期次计，不足 min_periods → skipped）
    min_periods: 5          # 子链质量时序最少期数（样本不足不误判）
    cooldown_days: 30       # scope 收缩/degraded 冷却期（与 energy_qa_review 一致）

  # L0 宏观 Beta 层（plans/55，仅 market=energy 生效）：
  # 识别市场 Beta 方向（RISK_ON/RISK_OFF/RANGE_BOUND）并顺 β 方向配置敞口——
  # RISK_OFF 压缩总敞口（off_scale）+ 信号管线降多头/放大空头（期货反向进攻）。
  # 信号：金融期货合成指数趋势（MA20-MA60）+ 20日 realized vol 分位 + IF0/TF0 股债比 z-score。
  # enabled 默认 false=现状（零行为变更）；CLI --enable-regime-beta 显式传参优先（信号管线）。
  # 2026-08-19 灰度开启（预测力决策门通过：step=1 日频 fwd=10 收益 K-W p=0.0203 显著 +
  # 排序 RISK_ON>RANGE_BOUND>RISK_OFF 正确，trace_id beta-kw-v3b-20260819）。
  # 灰度保守档：off_scale 0.5→0.7（压缩 30% 温和）、off_long_suppress 0.40→0.25、
  # off_short_boost 0.20→0.10（方向偏置温和起步），观察稳定后按回测/实盘校准调优。
  regime_beta_layer:
    enabled: true
    days: 130                # 金融期货数据回溯天数
    fin_symbols: [IF0, IH0, IC0, IM0, TF0, TS0]  # CFFEX 合成指数成分（FTS 连续合约格式）
    trend_window_short: 20   # 趋势短窗（MA20）
    trend_window_long: 60    # 趋势长窗（MA60）
    vol_window: 20           # realized vol 窗口
    vol_threshold_percentile: 0.8  # 高波动历史分位阈值
    risk_pref_pair: [IF0, TF0]     # 股债比：风险资产/避险资产（FTS 池内无 T0，以 TF0 为避险锚）
    risk_pref_window: 20     # 股债比滚动 z-score 窗口
    min_confidence: 0.5      # 置信度门槛：低于 → RANGE_BOUND（不偏置）
    min_votes: 2             # 软投票最少一致信号数
    on_scale: 1.0            # RISK_ON 总敞口倍率（顺正β，不放大）
    on_long_boost: 0.10      # RISK_ON 多头加分
    on_short_suppress: 0.10  # RISK_ON 空头减分
    off_scale: 0.7           # RISK_OFF 总敞口倍率（灰度保守档：压缩 30%）
    off_long_suppress: 0.25  # RISK_OFF 多头抑制（灰度保守档：×0.75）
    off_short_boost: 0.10    # RISK_OFF 空头放大（灰度保守档：×1.10）

  # 拥挤度体系化（plans/56，仅 market=energy 生效）：
  # 6 信号（板块相关趋近/放量滞涨/动量衰竭/波动突升/OI 天量/换手透支）合成拥挤度 score
  # + 方向分解（多头/空头拥挤，逼空识别）→ 联合门控（高置信+高拥挤减半、低置信+高拥挤离场）
  # + 多空方向偏置（减多不抢反弹、减空不追空）。enabled 默认 false=现状（零行为变更）；
  # CLI --enable-regime-crowding 显式传参优先（信号管线）。与 Beta 层（55）正交互补。
  regime_crowding:
    enabled: false
    days: 300                # 拥挤度面板回溯天数（≥ 动量长窗 + 分位历史）
    corr_window: 20          # 板块内品种相关滚动窗口
    corr_percentile: 0.75     # 相关历史分位（创新高 → 触发）
    corr_min_level: 0.5      # 相关绝对水平下限
    volume_ratio_threshold: 1.5  # 量能比阈值（volume/20日均量，放量）
    price_stall_threshold: 0.01   # 放量滞涨：|短期涨幅| < 阈值
    momentum_short: 20       # 动量短窗
    momentum_long: 60        # 动量长窗
    vol_window: 20           # realized vol 窗口
    vol_spike_percentile: 0.75    # 波动突升分位
    oi_window: 20            # OI 量能比窗口
    oi_percentile: 0.75       # OI 天量分位
    turnover_window: 20      # 换手率窗口
    turnover_percentile: 0.75 # 换手透支分位
    stall_trigger_ratio: 0.5 # 板块内信号触发品种占比阈值
    high_crowding: 0.4       # 高拥挤阈值（≥ → 触发门控）
    direction_window: 20     # 方向分解收益窗口
    confidence_threshold: 0.5    # 联合门控置信度高/低分界
    high_conf_high_crowd_scale: 0.5  # 高置信+高拥挤 → 敞口减半
    low_conf_high_crowd_scale: 0.0   # 低置信+高拥挤 → 离场
    long_crowd_suppress: 0.30   # 多头拥挤：多头信号 ×0.70（减多不抢反弹）
    short_crowd_suppress: 0.30  # 空头拥挤：空头信号 ×0.70（减空不追空/不逼空）

# L2/L3 子链适用性画像显著性护栏（plans/47 §A3，subchain_profile.py 参数化 SSOT；
# 三门槛 AND：min_symbols / min_t_stat(df=n-1) / min_chain_ic）
# v2.105.0+16: min_chain_ic 从 0.10 降至 0.02（2026-08-19 验证：8 个因子中 6 个在 0.02 阈值下通过子链评估，
# 原 0.10 过于严格导致有效全链因子被误判为无效，详见子链质量评估专项）
subchain_profile:
  min_symbols: 3
  min_t_stat: 2.0
  min_chain_ic: 0.02

# 因子×Regime 画像护栏（plans/53 §A/§C，regime_profile.py 参数化 SSOT）：
# 三门槛 AND：min_regime_samples / ICIR>0 / min_abs_ic；
# min_positive_regimes=晋升硬门槛——regime_ic_report 存在且有效制度数低于此值 → 拒绝晋升。
regime_profile:
  min_regime_samples: 20
  min_positive_regimes: 2
  min_abs_ic: 0.05
  all_regimes_effective_min: 3
  # L3 合成模式默认值（v2.104.0+62，CLI --synthesis-mode 显式传参优先）：
  # mode 可选 equal_weight / quality_weight / sharpe_weight / elastic_net /
  #   adaptive / optimizer / risk_parity（= optimizer + risk_parity 目标快捷，
  #   因子收益矩阵自动构建仅用于权重合成，指标口径保持估算）
  # 直接改 mode 即可切换合成方法，无需改代码。
  synthesis:
    mode: equal_weight
    optimizer_mode: risk_parity
  # OWL 因子分组筛选旁路（plans/41 方案 A）：与 Step 1.8 信号聚类互补——
  # 信号聚类管"信号长得像不像"，OWL 管"对横截面收益有没有独立解释力"。
  # report_only=true 仅输出交叉比对报告（memory/portfolio/{universe}/owl_report_*.json），
  # 不修改 factors 列表；false 时按检验结果剔除非显著组（预留，本期不实现）。
  owl:
    enabled: false          # 默认关闭：零开销零行为变更
    weight_scheme: linear   # OWL 权重衰减方案（linear/exp/log）
    weight_tuning: 0.5      # 权重衰减强度 (0,1]
    train_frac: 0.7         # 样本外切割训练窗比例（OWL 系数只用前段，防数据窥探）
    group_corr_threshold: 0.5  # 系数分组相关阈值 |corr|>=thr 视为同组
    lambda_: 0.05           # OWL 正则化强度（0.5/n 归一尺度，与 sklearn Lasso 对齐）
    report_only: true

# ── 日志 ──
log_level: "INFO"
log_file: "logs/fts.log"
