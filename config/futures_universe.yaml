# config/futures_universe.yaml — 期货品种池与产业链分类单一事实源（SSOT）
#
# 加载优先级: 本文件 > fts/data_futures.py 内置默认（兜底，YAML 缺失/损坏/校验失败时回退并告警）
# 消费契约: 本文件驱动以下模块级常量（fts/data_futures.py，消费方 import 不受影响）:
#   FUTURES_SUBSET          = universe 展平（82 品种）
#   FUTURES_CORE_SUBSET     = core_subset
#   FUTURES_HOLDOUT         = holdout（盲测池，不参与训练）
#   FUTURES_SECTOR_MAP      = sector_map + "炼化聚酯链"（由 energy.chain_symbols 自动生成置首位）
#   FUTURES_STRATIFIED_SUBSET = stratified_subset（分层训练集）
#   ENERGY_CHAIN_*          = workflows.energy.*（训练池 / 泛化范围 / 盲测池派生 / 输出目录）
#
# 修改说明: 调整品种池 / 产业链分类 / energy 工作流只需改本文件，无需改代码。
#   energy 盲测池自动派生 = 泛化范围（chemical_sectors）全部成员 − 训练池（chain_symbols）。
# 校验规则（loader 内置）: 品种池 ⊆ universe、盲测池 ∩ 分层训练集 = ∅、
#   泛化范围子链名必须存在于 sector_map、训练池 ⊆ universe、无重复品种。

