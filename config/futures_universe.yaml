# ══════════════════════════════════════════════════════════════════
# 3. 盲测池 holdout（15 = FUTURES_HOLDOUT，不参与演化训练，验证因子泛化能力）
#    机构标准（GAP-055）：固定锁死保代际可比 + 防数据窥探、按产业链分层抽样、
#    与核心池和分层训练集互不重叠、覆盖大中小流动性品种。
# ══════════════════════════════════════════════════════════════════
holdout:
  - JM0   # 焦煤（黑色系，与训练集焦炭 J0 互补）
  - AL0   # 铝（有色金属，大流动性）
  - PB0   # 铅（有色金属，中流动性）
  - BU0   # 沥青（能源，炼化下游）
  - EG0   # 乙二醇（聚酯链）
  - L0    # 聚乙烯（油化工，塑料，大流动性）
  - FG0   # 玻璃（煤化工/建材）
  - UR0   # 尿素（煤化工）
  - NR0   # 20号胶（橡胶，能源化工）
  - RU0   # 橡胶（橡胶，大流动性）
  - SP0   # 纸浆（造纸）
  - EC0   # 集运欧线（航运，独立产业链，高波动尾部）
  - JD0   # 鸡蛋（农产品，禽蛋）
  - AP0   # 苹果（农产品，果蔬）
  - LH0   # 生猪（农产品，畜产品，波动大）

# ══════════════════════════════════════════════════════════════════
# 4. 分层训练集 stratified_subset（19 = FUTURES_STRATIFIED_SUBSET，
#    按产业链从每组选取 2-3 个代表品种，确保训练覆盖所有产业链类别，排除盲测池）
# ══════════════════════════════════════════════════════════════════
stratified_subset:
  # 黑色系
  - RB0   # 螺纹钢
  - I0    # 铁矿石
  - J0    # 焦炭
  # 有色金属
  - CU0   # 铜
  - ZN0   # 锌
  - NI0   # 镍
  # 能源 → 原油/燃料油/沥青；聚酯链 → PX→PTA→聚酯；油化工/煤化工/橡胶/造纸/航运
  - TA0   # PTA（聚酯链）
  - MA0   # 甲醇（煤化工）
  - SC0   # 原油（能源）
  # 农产品
  - M0    # 豆粕
  - C0    # 玉米
  - SR0   # 白糖
  # 贵金属
  - AU0   # 黄金
  - AG0   # 白银
  # 新能源/新材料
  - LC0   # 碳酸锂
  - SI0   # 工业硅
  # 金融期货
  - IF0   # 沪深300
  - IC0   # 中证500
  - IH0   # 上证50

# ══════════════════════════════════════════════════════════════════
# 5. 产业链分类 sector_map（17 产业链 = FUTURES_SECTOR_MAP 主体）
#    注: "炼化聚酯链"分组不在此重复——由 workflows.energy.chain_symbols
#    自动生成并置于首位（与能源链训练池保持对齐，通用中性化反向映射
#    按"后序覆盖前序"不受影响，v2.104.0+38）。
# ══════════════════════════════════════════════════════════════════
sector_map:
  黑色系:        [I0, RB0, HC0, SS0, J0, JM0, SF0, SM0]          # 钢铁产业链 + 焦煤焦炭 + 铁合金
  有色金属:      [CU0, AL0, ZN0, PB0, SN0, NI0, BC0, AO0, AD0]   # 基本金属（含铜/铝衍生）
  能源:          [SC0, FU0, LU0, BU0]                            # 原油/燃料油/沥青
  聚酯链:        [PX0, TA0, PF0, PR0, EG0]                       # 对二甲苯→PTA→聚酯(短纤/瓶片), 乙二醇
  油化工:        [L0, PP0, V0, PG0, EB0, BZ0, PL0]               # 聚乙烯/聚丙烯/聚氯乙烯/液化气/苯乙烯/苯/丙烯
  煤化工:        [MA0, SA0, UR0, FG0, SH0]                       # 甲醇/纯碱/尿素/玻璃/烧碱
  橡胶:          [RU0, NR0, BR0]                                 # 天然橡胶/20号胶/丁二烯橡胶
  造纸/林浆纸:   [SP0, LG0, FB0, OP0]                            # 纸浆/原木/纤维板/双胶纸（木材→纸浆→纸品）
  航运:          [EC0]                                           # 集运欧线（航运运价，独立于商品产业链）
  油脂油料:      [A0, B0, M0, Y0, P0, OI0, RS0, RM0, PK0]        # 豆系/棕榈油 + 菜籽系 + 花生
  谷物:          [C0, CS0, RR0, WH0, JR0, RI0, LR0]              # 玉米/淀粉/稻米/麦
  畜牧:          [LH0, JD0]                                      # 生猪/鸡蛋（养殖链）
  软商品:        [SR0, CF0, CY0]                                 # 白糖/棉花/棉纱（进口/天气驱动）
  果蔬:          [AP0, CJ0]                                      # 苹果/红枣（鲜果现货驱动）
  贵金属:        [AU0, AG0, PT0, PD0]                            # 黄金/白银/铂/钯
  新能源/新材料:  [LC0, SI0, PS0]                                 # 碳酸锂/工业硅/多晶硅
  金融期货:      [IF0, IC0, IH0, IM0, TF0, TS0, T0, TL0]          # 股指 + 国债（含 10Y/30Y，2026-08-20）

# ══════════════════════════════════════════════════════════════════
# 6. 产业链专属工作流 workflows（ENERGY_CHAIN_*）
#    energy 盲测池（ENERGY_CHAIN_HOLDOUT）自动派生 = 泛化范围全部成员 − 训练池，
#    因此只配置训练池 + 泛化范围即可，盲测池无需手写。
# ══════════════════════════════════════════════════════════════════
workflows:
  energy:
    # 训练池（ENERGY_CHAIN_SYMBOLS / ENERGY_CHAIN_TRAIN）：
    # 五大化工子链（能源 3 + 聚酯 3 + 油化工 3 + 煤化工 3 + 橡胶 2），
    # 2026-08-19 增扩橡胶子链 RU0/BR0 入训练池，NR0 保留盲测池做泛化检验；
    # 2026-08-15 由 9 扩至 12 降训练池内相关性（LU/PR 与 FU/PF 高相关换出至盲测池）。
    # v2.104.0+106（GAP-133）：聚酯链代表 PX0→EG0——PX0 2023-09 上市仅 704 行会封顶训练
    # 公共窗口（走航窗口数受限），EG0 2018-12 上市 1861 行；PX0 自动回盲测池。
    chain_symbols:
      - SC0   # 原油（能源，链上游源头）
      - FU0   # 燃料油（能源，原油下游）
      - BU0   # 沥青（能源，炼化下游）
      - PF0   # 短纤（聚酯链，聚酯成品）
      - TA0   # PTA（聚酯链，中游）
      - EG0   # 乙二醇（聚酯链，原料/防冻剂）
      - L0    # 聚乙烯（油化工，塑料）
      - PP0   # 聚丙烯（油化工，塑料）
      - PG0   # 液化石油气（油化工，炼厂伴生气）
      - MA0   # 甲醇（煤化工，煤基化工）
      - UR0   # 尿素（煤化工，氮肥）
      - SA0   # 纯碱（煤化工/建材）
      - RU0   # 天然橡胶（橡胶，2026-08-19 自盲测池升维）
      - BR0   # 丁二烯橡胶（橡胶，2026-08-19 自盲测池升维）
    # 泛化范围（ENERGY_CHAIN_CHEMICAL_SECTORS，盲测池来源子链）
    # 2026-08-19 增扩橡胶子链（RU0/NR0/BR0），盲测池自动派生
    chemical_sectors:
      - 聚酯链
      - 油化工
      - 煤化工
      - 橡胶
    # 因子库/精英目录路由标记（ENERGY_CHAIN_MARKET）
    market: energy
    # 训练品种最小历史深度阈值（ENERGY_CHAIN_MIN_TRAIN_ROWS，真实非 SYNTHETIC 日线行数）
    min_train_rows: 300
    # 盲测池品种最小真实历史门槛（ENERGY_CHAIN_MIN_HOLDOUT_ROWS，v2.104.0+81 GAP-130）：
    # 盲测 IC 验证跳过历史不足的品种（数据样本过小 IC 估计噪声大），仅作防线；
    # 对齐修复（GAP-130）后新上市品种（BZ0/PL0 等）已正确参与盲测，此门槛只过滤
    # 真正过短的样本（默认 250 ≈ 1 年交易日）
    min_holdout_rows: 250
    # L1 独立输出目录（ENERGY_CHAIN_L1_*，与通用 L1 严格隔离）
    l1_memory_dir: memory/meta_loop/energy
    l1_pool_path: memory/knowledge/factors/factor_pool_energy.json
    l1_inject_dir: memory/knowledge/factors/l1_injected_energy
    l1_debates_dir: memory/debates/energy

# ══════════════════════════════════════════════════════════════════
# 7. 全期货覆盖优先级规划 coverage_priority（plans/57 §9 步骤0，FUTURES_COVERAGE_PLAN）
#    目标：智能因子系统面向全部期货所有品种（84 品种 / 17 产业链）。
#    以 RD 全市场骨架（6 产业链）为策略消费基准，FTS 17 产业链为因子生产细化。
#    扩展优先级 P0→P3，逐链推进（每链先小规模验证再铺开），
#    扩展完成前 RD 本地 11 因子对未覆盖链兜底。
#    校验：每级 symbols ⊆ universe、四级别交集为空、并集 = universe（loader 内置断言）。
# ══════════════════════════════════════════════════════════════════
coverage_priority:
  # P0 能源化工（24 品种，先行）：能源 SC/FU/BU/LU、聚酯链 TA/PF/EG/PX/PR、
  #   油化工 L/PP/V/PG/EB/BZ/PL、煤化工 MA/SA/UR/FG/SH、橡胶 RU/BR/NR。
  #   存量因子（含退役）集中重审衔接（plans/57 §6.8）。
  P0_energy_chemicals:
    chains: [能源, 聚酯链, 油化工, 煤化工, 橡胶]
    symbols: [SC0, FU0, BU0, LU0, TA0, PF0, EG0, PX0, PR0, L0, PP0, V0, PG0, EB0, BZ0, PL0, MA0, SA0, UR0, FG0, SH0, RU0, BR0, NR0]
  # P1 黑色系（8）+ 有色金属（9）（17 品种）：RB/HC/I/J/JM/SS/SM/SF；CU/AL/ZN/NI/PB/SN/BC/AO/AD。
  #   量价适用强、流动性好。
  P1_ferrous_nonferrous:
    chains: [黑色系, 有色金属]
    symbols: [RB0, HC0, I0, J0, JM0, SS0, SM0, SF0, CU0, AL0, ZN0, NI0, PB0, SN0, BC0, AO0, AD0]
  # P2 农产品群 + 贵金属（27 品种）：油脂油料 M/Y/A/B/P/OI/RM/RS/PK、谷物 C/CS/RR/WH/JR/RI/LR、
  #   软商品 SR/CF/CY、畜牧 LH/JD、果蔬 AP/CJ、贵金属 AU/AG/PT/PD。
  P2_agri_precious:
    chains: [油脂油料, 谷物, 软商品, 畜牧, 果蔬, 贵金属]
    symbols: [M0, Y0, A0, B0, P0, OI0, RM0, RS0, PK0, C0, CS0, RR0, WH0, JR0, RI0, LR0, SR0, CF0, CY0, LH0, JD0, AP0, CJ0, AU0, AG0, PT0, PD0]
  # P3 金融期货（8）+ 新能源/新材料（3）+ 造纸/航运（5）（16 品种）：IF/IH/IC/IM/T/TF/TS/TL；
  #   LC/SI/PS；SP/LG/FB/OP/EC。逻辑特殊或数据浅，先做 QuantData 可用性核查。
  P3_financial_newenergy:
    chains: [金融期货, 新能源/新材料, 造纸/林浆纸, 航运]
    symbols: [IF0, IH0, IC0, IM0, T0, TF0, TS0, TL0, LC0, SI0, PS0, SP0, LG0, FB0, OP0, EC0]
