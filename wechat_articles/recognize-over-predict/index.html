<script id="post-data" type="application/json">{
  "body_html": "<p style=\"text-align:center;font-size:13px;letter-spacing:4px;color:#9a8c6a;margin:0 0 10px;\">各归其位 · 交易认知与量化落地</p>\n<p style=\"text-align:center;font-size:26px;font-weight:bold;color:#1a1a1a;line-height:1.4;margin:8px 0 6px;\">把\"识别优于预测\"<br/>变成系统纪律之后，发生了什么</p>\n<p style=\"text-align:center;font-size:14px;color:#888;margin:0 0 30px;\">一套量化系统最诚实的部分，是它的失败记录</p>\n\n<!-- 开场 -->\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:20px 0 0;\">我的量化系统里，第一个市场状态识别模块，第一轮检验的 p 值是 <strong style=\"color:#8b1a1a;\">0.71</strong>——统计学上等于什么都没测出来。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">那是一个很普通的周五，我盯着报告，第一反应是删掉它。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">三个月后，同一个模块通过了检验：p=0.0203。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">中间只改了一个东西——把检测频率从五天一次改成每天一次。样本从 70 个变成 353 个。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:14px 0 0;\">我没有优化模型，没有加参数，没有换数据源。我只是给了它足够的样本去说话。</p>\n<p style=\"font-size:16px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:16px 0 0;\">这篇文章想讲的观点，前置在这里：交易的本质不是预测 Alpha，而是识别市场状态、并对自己识别的结果负责。把这件事做成系统的纪律，比任何模型都值钱。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">接下来我用三个部分展开：为什么\"识别\"比\"预测\"可靠、可靠的识别怎么落地、以及识别体系自己失效时怎么办。最后一部分，是我这套系统最诚实的记录。</p>\n\n<!-- 01 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">交易到底在做什么</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">先问一个最基础的问题：一笔交易，你赚的是什么钱？</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">市场的主流叙事是：预测 Alpha。预测这只股票、这个品种明天涨还是跌，赚\"预测对\"的钱。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">我把这个框架推翻了。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">交易的本质，是<strong>在状态不确定的条件下做概率决策</strong>。它由三根支柱构成：</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:12px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:4px;\">支柱一</span> <strong>状态识别</strong>——降低不确定性：现在市场处于哪个状态（趋势/震荡/高波动）。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:4px;\">支柱二</span> <strong>应对映射</strong>——状态对应策略：这个状态下该用哪套打法。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:4px;\">支柱三</span> <strong>赔率与风险预算</strong>——下多大注、何时认错。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:14px 0 0;\">三者缺一不可。识别错了会亏；识别对了应对错了会亏；前两个都对、仓位错了，照样出局。</p>\n<p style=\"font-size:15px;font-weight:bold;color:#8b1a1a;line-height:1.8;margin:12px 0 0;\">市场上有大量人花 90% 的精力在\"预测涨跌\"这一个动作上，而另外两根支柱几乎是空的。这是大多数交易者亏钱的真正原因——不是预测得不够准，是系统的三根支柱缺了两根。</p>\n\n<!-- 02 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">为什么识别优于预测</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">说\"识别优于预测\"之前，得先回答：为什么预测不可靠？</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">一个关于\"规律\"的残酷事实：<strong style=\"color:#1a1a1a;\">可被观测的预测规律，会被套利主动消灭。</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">你发现\"连续两天放量上涨后第三天大概率涨\"，于是资金涌进来抢这个规律。抢的人越多，规律失效得越快。观测本身改变了被观测的对象——这是预测的天敌。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">识别不一样。你识别\"当前市场处于趋势状态还是震荡状态\"——你的观测不会改变市场状态本身。市场不会因为有人识别出了牛市就结束牛市。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:14px 0 0;\">把两者的差异摊开看：</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;color:#333;margin:14px 0 0;\">\n<tr style=\"background:#f2f0ea;\"><th style=\"border:1px solid #ddd;padding:8px 6px;font-weight:bold;text-align:left;color:#1a1a1a;\">维度</th><th style=\"border:1px solid #ddd;padding:8px 6px;font-weight:bold;text-align:left;color:#1a1a1a;\">预测因子收益</th><th style=\"border:1px solid #ddd;padding:8px 6px;font-weight:bold;text-align:left;color:#1a1a1a;\">识别市场状态</th></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">衰退机制</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">被套利主动消灭</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">被动结构漂移</td></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">观测影响</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">观测→资金涌入→消灭</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">观测不影响状态本身</td></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">衰退速度</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">数月~数年</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">数年~十年</td></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">防御方式</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">失效熔断+拥挤监控</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">定期重估+漂移监控</td></tr>\n</table>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:12px 0 0;\">用一句话记住这组对比：</p>\n<p style=\"font-size:16px;font-weight:bold;color:#8b1a1a;line-height:1.8;margin:10px 0 0;\">预测的可靠性死于被消灭，识别的可靠性死于被遗忘。前者不可逆，后者可维护。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">这就是为什么\"识别\"可以做成系统纪律，而\"预测\"只能做成短期套利。</p>\n\n<!-- 03 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">听风者：一个关于\"识别\"的框架</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">市场上有个老比喻：风口上的猪——猪不需要会飞，风来了自然就飘起来了。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">我喜欢这个比喻，但它有个漏洞：猪是<strong>幸运</strong>的，被风吹起来是被动的。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">做一个<strong>听风者</strong>，是专业版本：带仪表听风、风变则变。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:14px 0 0;\"><strong>听风者六动作</strong>——这套系统每个环节都能对上号：</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">听</span>不需要预测风——不做价格预测，只感知状态。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">顺</span>顺着风飘——识别出方向就顺势，不逆势对抗。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">带伞</span>风控——永远带着防御，风太大就收。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">变</span>风变则变——状态切换立即调整，不恋战。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">恒</span>持续听——不\"等风来\"再听，始终在听。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">不承诺</span>听不承诺——只感知当前风向，不预测明日有风。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:14px 0 0;\">这里有一个我必须强调的诚实边界：<strong>听，要带着仪表听。</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">听的规则（信号怎么定义）、听的结论（现在是什么状态）、听的置信度（有多确定）——全部可审计、可复现。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">玄学的\"听\"是自我欺骗，系统的\"听\"才是状态识别。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">医学的诊断思维和这个一模一样。医生不会预测你\"明天几点退烧\"，他识别你\"当前处于什么病程状态\"，然后选择对应的治疗方案。诊断不预测——但诊断可以维护、可以复核、可以改进。预测不行。</p>\n\n<!-- 04 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">工程映射：识别怎么落地成纪律</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">理论说完了，说真事。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">我把\"识别优于预测\"落地成系统的第一步，是做一个<strong>市场风险偏好识别器</strong>：用金融期货的合成指数（趋势 + 波动 + 股债比三个信号），把市场分成三态——风险偏好强（RISK_ON）、风险偏好弱（RISK_OFF）、状态不明（RANGE_BOUND）。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">识别出来之后做什么？<strong style=\"color:#1a1a1a;\">顺状态方向配置敞口</strong>：正 Beta 市场做多，负 Beta 市场做空（期货可以双向），状态不明就轻仓。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">这段流程本身不稀奇，很多人写过。真正让我学到东西的，是验证它的过程——我用了一套<strong>决策门纪律</strong>：任何一个识别模块，必须通过统计检验才允许进仓位；不显著就停，不烧钱。</p>\n\n<p style=\"font-size:15px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:16px 0 0;\">▍第一轮：差点删掉它</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">识别器跑出来，用 70 个历史样本做检验：三组状态对未来 10 日收益的区分度，K-W 检验 p=0.71，而且排序还是反的——被标为\"风险偏好弱\"的时段，收益反而最高。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">第一反应是删。信号和直觉完全相反，留着干什么？</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">我忍住了，先问了一个问题：<strong>是这个信号没价值，还是我没给它足够的证据？</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">查了一下：识别器按 5 天一次采样，一年才 70 个样本点。样本这么少，p 值 0.71 说明不了任何事——它既不能证明信号有效，也不能证明信号无效。</p>\n\n<p style=\"font-size:15px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:16px 0 0;\">▍第二轮：只改了一个参数</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">把采样频率从 5 天一次改成每天一次，样本从 70 变成 353。其他什么都没动。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">结果：</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;color:#333;margin:14px 0 0;\">\n<tr style=\"background:#f2f0ea;\"><th style=\"border:1px solid #ddd;padding:8px 6px;font-weight:bold;text-align:left;color:#1a1a1a;\">市场状态</th><th style=\"border:1px solid #ddd;padding:8px 6px;font-weight:bold;text-align:left;color:#1a1a1a;\">样本数</th><th style=\"border:1px solid #ddd;padding:8px 6px;font-weight:bold;text-align:left;color:#1a1a1a;\">未来10日收益</th></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">RISK_ON（风险偏好强）</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">42</td><td style=\"border:1px solid #ddd;padding:8px 6px;\"><strong style=\"color:#1a6b3c;\">+27.9%</strong></td></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">RANGE_BOUND（状态不明）</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">244</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">+26.4%</td></tr>\n<tr><td style=\"border:1px solid #ddd;padding:8px 6px;\">RISK_OFF（风险偏好弱）</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">67</td><td style=\"border:1px solid #ddd;padding:8px 6px;\">+12.1%</td></tr>\n</table>\n<p style=\"font-size:13px;color:#999;line-height:1.6;margin:6px 0 0;\">K-W 检验 p=0.0203，三组排序正确（累计收益口径）。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:12px 0 0;\">识别出\"风险偏好弱\"的时段，10 日累计收益比\"风险偏好强\"的时段低一半以上。方向终于对了。</p>\n<p style=\"font-size:16px;font-weight:bold;color:#8b1a1a;line-height:1.8;margin:12px 0 0;\">识别模块要用它自己生成的样本密度去检验，别用采样频率人为饿死它。第一轮的失败不是信号的失败，是检验设计的失败。</p>\n\n<p style=\"font-size:15px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:16px 0 0;\">▍第三轮：门控和证据是两回事</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">同样在这个模块上，我犯过一个更隐蔽的错误：一开始把\"低波动\"当成独立的做多证据。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">结果横盘+低波的市场会被误判成\"风险偏好强\"。后来想明白：低波动只是\"确认趋势\"的<strong>必要条件</strong>，不是\"趋势向上\"的<strong>证据</strong>。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">门控（条件）和证据（信号）是两回事。混淆它们，是识别类系统最常见的隐性 bug。</p>\n\n<p style=\"font-size:15px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:16px 0 0;\">▍被拦下的那个模块：拥挤度识别</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">同一个决策门纪律，把 Beta 识别放进去了，却把另一个识别模块拦在了外面——拥挤度识别。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">拥挤度识别要回答的问题是：趋势是不是已经被透支了？六个量价信号合成一个\"拥挤度得分\"，高拥挤时减仓、逼空时防御。逻辑上非常自洽。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">然后决策门说：不行。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\"><strong>第一轮：</strong>高拥挤组的样本只有 2 个（总共 105 个），统计上根本无法检验。事件研究更难看：过去十年十次大跌，它一次都没提前预警，命中率 0%。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\"><strong>第二轮：</strong>校准阈值后样本够了（36 个），但 K-W p=0.79 依然不显著。事件研究：大跌前 5 日触发命中率 50%（目标 ≥70%），误报率 68.6%（目标 &lt;40%）。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">两轮检验，两个结论：<strong style=\"color:#8b1a1a;\">量价拥挤度捕捉到的是\"高波动、高参与\"的状态，不是\"即将崩盘\"的状态。</strong>我想要的信号，它给不了。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">处理方式：降级为纯观测层。信号继续算、继续记录，但绝不进仓位决策。</p>\n<p style=\"font-size:16px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:12px 0 0;\">同一个框架里，一个识别模块通过、一个被拦下。系统纪律的完整含义不只是\"留下对的\"，更是\"拦下错的\"——而拦下错的，往往需要更大的勇气。</p>\n\n<!-- 05 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">监控前提，而不是结果</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">识别模块上线后，怎么知道它还活着？</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">多数人会盯着\"还赚不赚钱\"——收益率。但收益率是<strong>结果</strong>，结果被噪声污染，短期根本看不出门道。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">正确的问题是：<strong style=\"color:#1a1a1a;\">它赖以成立的前提条件还在不在？</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">趋势策略的前提是\"趋势结构还在\"——趋势强度跌破阈值，前提消失，不管它这周赚没赚钱，先告警。高波动策略的前提是\"波动率还处高位\"——波动率回落到历史低位，前提消失，它的策略逻辑已经失效了。</p>\n<p style=\"font-size:16px;font-weight:bold;color:#8b1a1a;line-height:1.8;margin:12px 0 0;\">前提消失才是真失效，收益下降只是症状。监控症状会骗你，监控前提不会。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">和它配套的，是让每个因子、每个策略显式回答一个问题：</p>\n<p style=\"font-size:16px;font-weight:bold;color:#1a1a1a;line-height:1.8;margin:12px 0 0;\">\"我在什么市场形态下会亏钱？\"</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">趋势因子必须写：趋势分跌破阈值时失效、持仓背离时失效。均值回归因子必须写：波动率突破区间时失效。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">这个回答不是写给我看的，是写给系统看的——它会成为因子生命周期里\"何时降级、何时剔除\"的依据。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">三问闭环就此成型：</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:4px;margin-right:6px;\">第一问</span>是否合理——假设书：剥离数学，用自然语言讲清\"凭什么赚\"。讲不完整，就说明没想清楚。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:4px;margin-right:6px;\">第二问</span>边界在哪——失效条件清单：什么市场形态下会亏钱。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:4px;margin-right:6px;\">第三问</span>怎么应对——防御动作表：退出路径、熔断规则、监控频率。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:12px 0 0;\">这个三问框架，是我这套系统里唯一可以带走、放到任何策略上都通用的东西。</p>\n\n<!-- 06 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">诚实的边界：识别也会失效</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">拥挤度识别的失败，给我留了一个更深的思考：识别降低不确定性，但<strong>不消灭不确定性</strong>。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">状态识别有自己的盲区。它擅长回答\"市场现在处于哪个状态\"，但\"状态的下一步会怎么变\"——它同样说不准。趋势状态可以持续三年，也可以下个月就反转。识别只能告诉你现在在哪，不能告诉你前方有什么。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">所以识别体系必须有配套的防御：</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">· 状态切换不立即行动，观察几日确认——跳变违背持续性，默认怀疑，要证据。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\">· 低置信度不动作，只留最小观察仓位。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\">· 低置信度不仅减仓，还缩小策略种类——仓位不是置信度的线性函数。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\">· 识别不可靠时，组合自动切到低 Beta 高 Alpha 模式（市场中性、均值回归），而不是硬扛。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:12px 0 0;\">以及被拦下的拥挤度模块给我的最后一课：一个没通过检验的信号体系，降级为观测层依然有价值——它忠实地记录了市场的\"高参与状态\"，只是不构成交易依据。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\"><strong>承认一个信号体系没通过检验，并保留它的观测价值，比硬接入它更接近专业。</strong></p>\n\n<!-- 结尾 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:46px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 24px;\">修正后的判断</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">回头看，这篇想说的其实是一句话：<strong style=\"color:#1a1a1a;\">交易者的进步，不是预测得越来越准，而是越来越清楚自己在什么状态下该做什么、不该做什么。</strong></p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">可带走的两个工具：</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">工具一</span><strong>三问审查</strong>：任何策略上线前，回答是否合理、边界在哪、怎么应对。三张表填不满，就不该碰。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\"><span style=\"display:inline-block;background:#8b1a1a;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:4px;margin-right:6px;\">工具二</span><strong>决策门纪律</strong>：不显著就停。留对的和拦错的，用的是同一把尺子。</p>\n\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:16px 0 0;\">最后，诚实地说清楚这套经验的边界：</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:10px 0 0;\">· 它成立的前提是<strong>期货多空双向、日线周期、量化系统可编程检验</strong>。单边只能做多的市场里，\"负 Beta 反向进攻\"不适用；没有检验能力的手工交易，决策门纪律无从谈起。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\">· 决策门方法本身也有主观裁量：样本量怎么取、窗口怎么选、事件怎么定义，每个环节都有选择空间。p 值不是免死金牌，它只是挡掉最明显的错觉。</p>\n<p style=\"font-size:15px;color:#333;line-height:1.8;margin:8px 0 0;\">· 识别降低不确定性，但不确定性永远在。带好伞，比算准风更重要。</p>\n\n<p style=\"font-size:14px;color:#999;line-height:1.8;margin:24px 0 0;border-top:1px solid #eee;padding-top:16px;\">本文观点不构成任何投资建议。投资有风险，入市需谨慎。</p>\n",
  "title": "把“识别优于预测”变成系统纪律之后，发生了什么",

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
