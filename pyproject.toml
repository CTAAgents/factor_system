[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fts"
version = "2.62.0"
description = "FTS — Factor Trading System: 独立因子策略系统，支持多因子挖掘、演化与交易"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dongcun Yang" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "shap>=0.46",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
evolution = [
    "optuna>=3.0",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
]
mcp = [
    "akshare>=1.18.64",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]
portfolio = [
    "scikit-learn>=1.3",
]
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
bridge = [
    "redis>=5.0",
]
regime = [
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]
monitor = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
data = [
    "requests>=2.28",
    "tqdm>=4.60",
    "pyarrow>=14.0",
]
# 全量开发环境（requirements.txt 一键安装时展开）
all = [
    "optuna>=3.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "akshare>=1.18.64",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "redis>=5.0",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "requests>=2.28",
    "tqdm>=4.60",
    "pyarrow>=14.0",
]

[project.scripts]
fts = "fts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fts --cov-report=term-missing -v"
