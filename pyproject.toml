[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fts"
version = "2.105.0+7"
description = "FTS — Factor Trading System: 独立因子策略系统，支持多因子挖掘、演化与交易"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dongcun Yang" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "shap>=0.46",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "numba==0.66.0",
    "llvmlite==0.48.0",
]

[project.optional-dependencies]
evolution = [
    "optuna>=3.0",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
]
mcp = [
    "akshare>=1.18.64",
]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
portfolio = [
    "scikit-learn>=1.3",
]
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
bridge = [
    "redis>=5.0",
]
regime = [
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]
monitor = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
distributed = [
    "distributed>=2024.3",
]
data = [
    "requests>=2.28",
    "tqdm>=4.60",
    "pyarrow>=14.0",
]
# 全量开发环境（requirements.txt 一键安装时展开）
all = [
    "optuna>=3.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "akshare>=1.18.64",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "redis>=5.0",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "requests>=2.28",
    "tqdm>=4.60",
    "pyarrow>=14.0",
    "cloudpickle>=2.0",
    "distributed>=2024.3",
]

[project.scripts]
fts = "fts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fts --cov-report=term-missing -v"
markers = [
    "slow: 重量级真实演化/回测测试（日常回归默认跳过，全量验收必跑）",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# 默认选择集：Pyflakes(F) + pycodestyle 错误(E4/E7/E9)
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# scripts/tests 顶部 sys.path 引导导入为项目惯用法（E402）
"scripts/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["fts"]
# 第三方库无 stubs 时视为 Any（numpy/pandas-stubs 已装但部分库缺失）
ignore_missing_imports = true
# 不分析被导入模块的类型（跨模块错误以本模块为主收敛）
follow_imports = "skip"
# pandas 数值类型摩擦（ExtensionArray operator / ufunc arg-type）——GAP-F12 暂豁免，后续收紧
disable_error_code = ["operator", "arg-type"]
# 允许未注解函数体不检查（存量代码渐进收敛）
check_untyped_defs = false
