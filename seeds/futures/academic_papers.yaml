- name: fut_inventory_change_rate
  description: 库存变化率：库存的月度变化率。库存下降=供应紧张=做多。Gorton(2013)证明库存是期货收益的核心预测变量。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            # 用成交量变化代理库存变化
            vol_change = (volume[window:] - volume[:-window]) / np.maximum(volume[:-window], 1e-10)
            sig = np.zeros(n)
            # 库存下降（成交量减少）= 供应紧张 = 做多
            sig[window:] = -np.tanh(vol_change * 2)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 5
    behavioral: 2
    microstructure: 3
    institutional: 4
    narrative: 库存变化率：库存的月度变化率。库存下降=供应紧张=做多。Gorton(2013)证明库存是期货收益的核心预测变量。
- name: fut_basis_inventory_combo
  description: 基差-库存联合因子：结合基差（近月-远月）和库存信号的联合因子。基差走强+库存下降=最强做多信号。Gorton(2013)理论基础。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            # 基差代理：短期收益率
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            # 库存代理：成交量变化
            vol_chg = np.diff(volume) / np.maximum(volume[:-1], 1e-10)
            sig = np.zeros(n)
            for i in range(window, n):
                basis = np.mean(ret[i - window : i])
                inv = np.mean(vol_chg[i - window : i])
                # 基差走强(+basis) + 库存下降(-inv) = 做多
                sig[i] = basis - inv
            sig = np.tanh(sig * 10)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 5
    behavioral: 2
    microstructure: 3
    institutional: 4
    narrative: 基差-库存联合因子：结合基差和库存信号的联合因子。基差走强+库存下降=最强做多信号。
