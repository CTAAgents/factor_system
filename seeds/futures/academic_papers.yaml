- name: fut_tsmom_vol_scaled
  description: 波动率缩放时序动量：将原始TSMOM收益用滚动波动率缩放，使每个品种贡献相同风险。Moskowitz(2012)核心贡献。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            lookback = int(params.get('lookback', 12))
            vol_span = int(params.get('vol_span', 60))
            target_vol = float(params.get('target_vol', 0.15))
            if n < max(lookback, vol_span) + 2:
                return np.zeros(n)
            # 过去 lookback 期收益率
            ret = (close[lookback:] - close[:-lookback]) / np.maximum(close[:-lookback], 1e-10)
            # 滚动波动率（指数加权）
            daily_ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            sig = np.zeros(n)
            for i in range(vol_span, n):
                ewma_vol = np.std(daily_ret[i - vol_span : i]) * np.sqrt(252)
                raw_signal = (close[i - lookback] < close[i - 1]) * 2 - 1  # 方向
                scaled_signal = raw_signal * (target_vol / max(ewma_vol, 0.01))
                sig[i] = np.clip(scaled_signal, -1.0, 1.0)
            return sig
  params:
    lookback: 12
    vol_span: 60
    target_vol: 0.15
  input_fields:
  - close
  lookback: 65
  output_type: signal
  frequency: daily
  economic_logic:
