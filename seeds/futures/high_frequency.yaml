- name: fut_hf_down_vol
  description: 高频实际下行波动率因子(日频近似)：仅负收益部分波动率。华泰自研130+最强因子之一。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 5))
        if n < window + 1:
            return np.zeros(n)
        returns = np.zeros(n)
        returns[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)
        dvol = np.zeros(n)
        for i in range(window, n):
            neg = returns[max(0, i-window+1):i+1]
            neg = neg[neg < 0]
            if len(neg) > 1:
                dvol[i] = np.std(neg)
        sig = -np.tanh(dvol * 50)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 5
  input_fields:
  - close
  lookback: 10
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 3
    microstructure: 4
    institutional: 2
    narrative: 高频实际下行波动率因子(日频近似)：仅负收益部分波动率。华泰自研130+最强因子之一。
