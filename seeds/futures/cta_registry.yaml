- name: basis_level
  description: 基差水平因子：(close-settle)/settle 滚动均值。CTA注册表核心因子。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        settle = data.get('settle', close).values if hasattr(data.get('settle', close), 'values') else data.get('settle', close)
        n = len(close)
        window = int(params.get('window', 10))
        if n < window + 1:
            return np.zeros(n)
        basis = (close - settle) / np.maximum(settle, 1e-10)
        avg_basis = np.convolve(basis, np.ones(window)/window, mode='same')
        sig = np.clip(avg_basis / 0.02, -1.0, 1.0)
        return sig
  params:
    window: 10
  input_fields:
  - close
  - settle
  lookback: 15
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 4
    institutional: 4
    narrative: 基差水平因子：(close-settle)/settle 滚动均值。CTA注册表核心因子。
- name: volatility_annual
  description: 年化波动率因子：20日滚动波动率年化。高波动做空（波动率溢价）。CTA注册表核心因子。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 20))
        if n < window + 1:
            return np.zeros(n)
        returns = np.zeros(n)
        returns[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)
        vol = np.array([np.std(returns[max(0, i-window+1):i+1]) * np.sqrt(252) for i in range(n)])
        sig = -np.tanh(vol / 0.5)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: 年化波动率因子：20日滚动波动率年化。高波动做空（波动率溢价）。CTA注册表核心因子。
- name: liquidity_ratio
  description: 成交持仓比因子：volume/hold 偏离度。流动性异常信号。CTA注册表核心因子。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
        hold = data['hold'].values if hasattr(data, 'hold') else data.get('hold', np.ones(len(close)))
        n = len(close)
        window = int(params.get('window', 20))
        if n < window + 1:
            return np.zeros(n)
        turnover = np.zeros(n)
        for i in range(1, n):
            turnover[i] = volume[i] / max(hold[i], 1)
        avg_turn = np.convolve(turnover, np.ones(window)/window, mode='same')
        dev = (turnover - avg_turn) / np.maximum(avg_turn, 1e-10)
        sig = np.tanh(dev * 2)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  - hold
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 4
    institutional: 3
    narrative: 成交持仓比因子：volume/hold 偏离度。流动性异常信号。CTA注册表核心因子。
