- name: oi_change_rate
  description: 持仓量变化率因子：5日持仓量变化率。资金流入/流出信号。CTA注册表核心因子。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        hold = data['hold'].values if hasattr(data, 'hold') else data.get('hold', np.zeros(1000))
        n = len(hold)
        window = int(params.get('window', 5))
        if n < window + 1:
            return np.zeros(n)
        oi_chg = np.zeros(n)
        oi_chg[window:] = (hold[window:] - hold[:-window]) / np.maximum(hold[:-window], 1e-10)
        sig = np.tanh(oi_chg * 5)
        return np.clip(sig, -1.0, 1.0)
  params:
