factors:
- name: tsmom_5d
  description: 5日时序动量：短期价格趋势跟踪。CTA注册表核心因子。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 5))
        if n < window + 1:
            return np.zeros(n)
        ret = np.zeros(n)
        ret[window:] = (close[window:] - close[:-window]) / np.maximum(close[:-window], 1e-10)
        sig = np.tanh(ret / 0.02)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 5
  input_fields:
  - close
  lookback: 10
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: 5日时序动量：短期价格趋势跟踪。CTA注册表核心因子。
