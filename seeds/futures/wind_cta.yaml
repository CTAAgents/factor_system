- name: fut_hurst
  description: Hurst指数因子：基于重标极差(R/S)分析的Hurst指数。H>0.5=趋势持续做动量，H<0.5=均值回归做反转。Wind平台市场分形结构判断。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 30))\n    min_chunk = int(params.get('min_chunk', 5))\n\n    def _hurst_rs(series):\n\
    \        n = len(series)\n        if n < min_chunk * 2:\n            return 0.5\n\
    \        # R/S 分析\n        mean = np.mean(series)\n        dev = series - mean\n\
    \        cumsum = np.cumsum(dev)\n        r = np.max(cumsum) - np.min(cumsum)\n\
    \        s = np.std(series, ddof=0)\n        if s < 1e-10:\n            return\
    \ 0.5\n        rs = r / s\n        return np.log(rs) / np.log(n) if n > 1 else\
    \ 0.5\n\n    hurst = np.zeros(n)\n    for i in range(window, n):\n        seg\
    \ = close[max(0, i-window+1):i+1]\n        h = _hurst_rs(seg)\n        hurst[i]\
    \ = np.clip(h, 0, 1)\n\n    # H > 0.5 趋势偏多，H < 0.5 反转偏空\n    signal = (hurst -\
    \ 0.5) * 2\n    signal = np.tanh(signal * 2)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
