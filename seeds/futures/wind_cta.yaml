- name: fut_vol_skew
  description: 波动率偏度因子：已实现波动率的偏度分布。正偏=波动率右尾长=下跌风险大偏空，负偏=波动率左尾长=反弹潜力偏多。Wind平台高阶波动率因子。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 20))\n    vol_window = int(params.get('vol_window', 10))\n\n    # 计算日收益率\n \
    \   ret = np.zeros(n)\n    ret[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1],\
    \ 1e-10)\n\n    # 已实现波动率（滚动标准差）\n    rv = np.zeros(n)\n    for i in range(vol_window,\
    \ n):\n        rv[i] = np.std(ret[max(0, i-vol_window+1):i+1], ddof=0)\n\n   \
    \ # 滚动偏度\n    skew = np.zeros(n)\n    for i in range(window, n):\n        seg\
    \ = ret[max(0, i-window+1):i+1]\n        if len(seg) > 2 and np.std(seg, ddof=0)\
    \ > 1e-10:\n            skew[i] = np.mean((seg - np.mean(seg)) ** 3) / (np.std(seg,\
    \ ddof=0) ** 3 + 1e-10)\n\n    # 正偏=下跌风险大偏空，负偏=反弹潜力偏多\n    signal = -np.tanh(skew\
    \ * 0.5)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
