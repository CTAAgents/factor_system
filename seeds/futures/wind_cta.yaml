    \ = np.std(up_ret, ddof=0) if len(up_ret) > 1 else 0\n        down_vol = np.std(down_ret,\
    \ ddof=0) if len(down_ret) > 1 else 0\n        if down_vol > 1e-10:\n        \
    \    asym[i] = up_vol / down_vol\n        elif up_vol > 1e-10:\n            asym[i]\
    \ = 2.0  # 只有上涨\n        else:\n            asym[i] = 1.0\n\n    # 上行/下行波动率比 <\
    \ 1 = 下跌更剧烈 = 偏空\n    signal = np.tanh((asym - 1) * 2)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
