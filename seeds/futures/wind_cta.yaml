    \ 'low') else data['low']\n    close = data['close'].values if hasattr(data, 'close')\
    \ else data['close']\n\n    window = int(params.get('window', 20))\n\n    # Rogers-Satchell\
    \ 波动率: σ² = ln(H/C)*ln(H/O) + ln(L/C)*ln(L/O)\n    log_ho = np.log(high / np.maximum(open_,\
    \ 1e-10))\n    log_lo = np.log(low / np.maximum(open_, 1e-10))\n    log_hc = np.log(high\
    \ / np.maximum(close, 1e-10))\n    log_lc = np.log(low / np.maximum(close, 1e-10))\n\
    \n    rs_var = log_ho * log_hc + log_lo * log_lc\n    rs_var = np.maximum(rs_var,\
    \ 0)\n\n    # 滚动均值\n    rs_vol = np.zeros(n)\n    for i in range(window, n):\n\
