- name: fut_efficiency_ratio
  description: 效率比因子：Kaufman效率比=方向变动/总变动。效率比高=强趋势做动量，效率比低=震荡做反转。Wind平台趋势质量判断核心。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 10))\n\n    # 方向变动 = |Close - Close_n|\n    # 总变动 = sum(|Close_i - Close_{i-1}|)\n\
    \    direction = np.zeros(n)\n    noise = np.zeros(n)\n    for i in range(window,\
    \ n):\n        direction[i] = np.abs(close[i] - close[i-window])\n        total_noise\
    \ = np.sum(np.abs(np.diff(close[max(0, i-window):i+1])))\n        noise[i] = total_noise\n\
    \n    # 效率比 = 方向 / 噪音\n    er = np.zeros(n)\n    mask = noise > 1e-10\n    er[mask]\
    \ = direction[mask] / noise[mask]\n    er = np.clip(er, 0, 1)\n\n    # 效率比高=趋势强做动量，效率比低=震荡做反转\n\
    \    # 映射到[-1, 1]：高效率偏正，低效率偏负\n    signal = (er - 0.5) * 2\n    signal = np.tanh(signal\
    \ * 1.5)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
