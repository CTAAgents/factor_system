- name: fut_tail_risk
  description: 尾部风险因子：基于极值收益率分布的尾部风险度量。尾部越厚=极端风险越大=偏空。Wind平台风险管理核心因子。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 30))\n    q = float(params.get('quantile', 0.05))\n\n    # 日收益率\n    ret = np.zeros(n)\n\
    \    ret[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)\n\n  \
    \  # 尾部风险: 下尾与上尾的比值\n    tail_ratio = np.zeros(n)\n    for i in range(window,\
    \ n):\n        seg = ret[max(0, i-window+1):i+1]\n        if len(seg) > 0:\n \
    \           lower = np.percentile(seg, q * 100)\n            upper = np.percentile(seg,\
    \ (1 - q) * 100)\n            # 下尾均值 / 上尾均值（绝对值）\n            lower_tail = seg[seg\
    \ <= lower]\n            upper_tail = seg[seg >= upper]\n            if len(upper_tail)\
    \ > 0 and np.abs(np.mean(upper_tail)) > 1e-10:\n                tail_ratio[i]\
    \ = np.abs(np.mean(lower_tail)) / np.abs(np.mean(upper_tail))\n            else:\n\
    \                tail_ratio[i] = 1.0\n\n    # 尾部比 > 1 = 下尾风险更大偏空，< 1 = 上尾机会更大偏多\n\
    \    signal = -np.tanh((tail_ratio - 1) * 3)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
