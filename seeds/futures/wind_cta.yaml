- name: fut_garman_klass
  description: Garman-Klass波动率因子：基于OHLC的日内波动率估计，比传统Close-to-Close波动率更高效。高波动偏空，低波动偏多。Wind平台经典波动率估计器。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    open_ = data['open'].values\
    \ if hasattr(data, 'open') else data['open']\n    high = data['high'].values if\
    \ hasattr(data, 'high') else data['high']\n    low = data['low'].values if hasattr(data,\
    \ 'low') else data['low']\n    close = data['close'].values if hasattr(data, 'close')\
    \ else data['close']\n\n    window = int(params.get('window', 20))\n\n    # Garman-Klass\
    \ 波动率: σ² = 0.5*(ln(H/L))² - (2*ln2-1)*(ln(C/O))²\n    log_hl = np.log(high /\
    \ np.maximum(low, 1e-10))\n    log_co = np.log(close / np.maximum(open_, 1e-10))\n\
    \    gk_var = 0.5 * log_hl ** 2 - (2 * np.log(2) - 1) * log_co ** 2\n    gk_var\
    \ = np.maximum(gk_var, 0)  # 防止负方差\n\n    # 滚动均值\n    gk_vol = np.zeros(n)\n \
    \   for i in range(window, n):\n        gk_vol[i] = np.sqrt(np.mean(gk_var[max(0,\
    \ i-window+1):i+1]))\n\n    # 归一化：高波动偏空，低波动偏多\n    gk_norm = gk_vol / np.maximum(close,\
    \ 1e-10)\n    signal = -np.tanh(gk_norm * 100)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
