    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 30))\n    kmax = int(params.get('kmax', 10))\n\n    def _higuchi_fd(series,\
    \ k_max):\n        n = len(series)\n        if n < k_max * 2:\n            return\
    \ 1.5\n        lk = np.zeros(k_max)\n        for k in range(1, k_max + 1):\n \
    \           lm = 0.0\n            for m in range(k):\n                n_m = int(np.floor((n\
    \ - m) / k))\n                if n_m <= 1:\n                    continue\n   \
    \             segments = series[m + np.arange(n_m) * k]\n                length\
    \ = np.sum(np.abs(np.diff(segments))) * (n - 1) / (n_m * k)\n                lm\
    \ += length\n            lk[k-1] = lm / k if k > 0 else 0\n        # 对log(k)和log(L(k))做线性回归\n\
    \        k_vals = np.arange(1, k_max + 1, dtype=float)\n        valid = lk > 1e-10\n\
    \        if np.sum(valid) < 3:\n            return 1.5\n        log_k = np.log(k_vals[valid])\n\
    \        log_l = np.log(lk[valid])\n        fd = (np.sum(log_k * log_l) - np.sum(log_k)\
    \ * np.sum(log_l) / len(log_k)) /              (np.sum(log_k ** 2) - np.sum(log_k)\
    \ ** 2 / len(log_k) + 1e-10)\n        return 2.0 - fd  # 分形维度\n\n    fd = np.zeros(n)\n\
    \    for i in range(window, n):\n        seg = close[max(0, i-window+1):i+1]\n\
    \        fd[i] = _higuchi_fd(seg, kmax)\n\n    # D接近1=趋势强，D接近2=噪音大\n    # 低分形维度(趋势强)偏多，高分形维度(噪音大)偏空\n\
    \    signal = np.tanh((1.5 - fd) * 2)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
