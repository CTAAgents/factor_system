    narrative: Garman-Klass波动率因子：基于OHLC的日内波动率估计，比传统Close-to-Close波动率更高效。高波动偏空，低波动偏多。
- name: fut_yang_zhang
  description: Yang-Zhang波动率因子：考虑跳空的最优波动率估计器，结合隔夜与日内波动。Wind平台最精确波动率估计。高波动偏空，低波动偏多。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    open_ = data['open'].values\
    \ if hasattr(data, 'open') else data['open']\n    high = data['high'].values if\
    \ hasattr(data, 'high') else data['high']\n    low = data['low'].values if hasattr(data,\
    \ 'low') else data['low']\n    close = data['close'].values if hasattr(data, 'close')\
    \ else data['close']\n\n    window = int(params.get('window', 20))\n\n    # 隔夜波动\n\
    \    overnight = np.zeros(n)\n    overnight[1:] = np.log(open_[1:] / np.maximum(close[:-1],\
    \ 1e-10))\n\n    # 日内波动\n    log_hl = np.log(high / np.maximum(low, 1e-10))\n\
    \    log_co = np.log(close / np.maximum(open_, 1e-10))\n\n    # 开收盘波动\n    open_close\
    \ = np.zeros(n)\n    open_close[1:] = np.log(close[1:] / np.maximum(open_[1:],\
    \ 1e-10))\n\n    yz_var = np.zeros(n)\n    for i in range(window, n):\n      \
    \  seg_o = overnight[max(0, i-window+1):i+1]\n        seg_hl = log_hl[max(0, i-window+1):i+1]\n\
    \        seg_co = log_co[max(0, i-window+1):i+1]\n        seg_oc = open_close[max(0,\
    \ i-window+1):i+1]\n\n        # σ² = σ_overnight² + k*σ_intraday² + (1-k)*σ_oc²\n\
    \        var_overnight = np.var(seg_o, ddof=0)\n        var_hl = np.var(seg_hl,\
    \ ddof=0)\n        var_co = np.var(seg_co, ddof=0)\n        var_oc = np.var(seg_oc,\
    \ ddof=0)\n\n        k = 0.34 / (1.34 + (window - 1) / (window + 1))\n       \
    \ yz_var[i] = var_overnight + k * var_hl + (1 - k) * var_oc\n\n    yz_vol = np.sqrt(np.maximum(yz_var,\
    \ 0))\n\n    # 归一化：高波动偏空\n    yz_norm = yz_vol / np.maximum(close, 1e-10)\n  \
    \  signal = -np.tanh(yz_norm * 100)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
