- name: fut_market_micro
  description: 市场微观结构因子：基于HLC的买卖压力指标。Close在H-L区间位置+成交量加权。买入压力大做多，卖出压力大做空。Wind平台微观结构分析因子。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n    volume = data['volume'].values if\
    \ hasattr(data, 'volume') else data['volume']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # 买卖压力：价格在H-L区间的位置\n    hl_range = np.maximum(high - low, 1e-10)\n\
    \    pressure = (close - low) / hl_range  # [0, 1]: 0=卖压大, 1=买压大\n\n    # 成交量加权买卖压力\n\
    \    vwap_pressure = pressure * volume\n\n    # 滚动平均\n    avg_pressure = np.zeros(n)\n\
    \    for i in range(window, n):\n        avg_pressure[i] = np.mean(vwap_pressure[max(0,\
    \ i-window+1):i+1]) / np.maximum(np.mean(volume[max(0, i-window+1):i+1]), 1e-10)\n\
    \n    # 映射到 [-1, 1]\n    signal = (avg_pressure - 0.5) * 2\n    signal = np.tanh(signal\
    \ * 2)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
