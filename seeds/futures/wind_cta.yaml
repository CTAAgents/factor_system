- name: fut_liquidity_gap
  description: 流动性缺口因子：价格冲击的预期成本度量。流动性缺口大=冲击成本高=偏空。Wind平台流动性风险度量。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n    volume = data['volume'].values if\
    \ hasattr(data, 'volume') else data['volume']\n\n    window = int(params.get('window',\
    \ 20))\n\n    # Amihud 非流动性指标: |r| / (P * V)\n    ret = np.zeros(n)\n    ret[1:]\
    \ = np.abs(close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)\n\n    amihud\
    \ = np.zeros(n)\n    for i in range(1, n):\n        dollar_vol = close[i] * volume[i]\n\
    \        if dollar_vol > 1e-10:\n            amihud[i] = ret[i] / dollar_vol *\
    \ 1e6  # 缩放\n\n    # 滚动均值\n    avg_illiquidity = np.zeros(n)\n    for i in range(window,\
    \ n):\n        avg_illiquidity[i] = np.mean(amihud[max(0, i-window+1):i+1])\n\n\
    \    # 流动性越差（Amihud越高）偏空\n    # 对数缩放\n    log_illiq = np.log(np.maximum(avg_illiquidity,\
    \ 1e-10))\n    signal = -np.tanh(log_illiq * 0.5)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
