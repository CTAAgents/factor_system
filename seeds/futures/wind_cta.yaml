- name: fut_serial_corr
  description: 序列相关因子：收益率自相关结构。正自相关=趋势延续做动量，负自相关=均值回归做反转。Wind平台市场效率判断因子。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 20))\n    lag = int(params.get('lag', 1))\n\n    # 日收益率\n    ret = np.zeros(n)\n\
    \    ret[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)\n\n  \
    \  # Lag自相关\n    autocorr = np.zeros(n)\n    for i in range(window + lag, n):\n\
    \        seg1 = ret[max(0, i-window+1):i+1-lag]\n        seg2 = ret[max(0, i-window+lag):i+1]\n\
    \        if len(seg1) > 1 and np.std(seg1, ddof=0) > 1e-10 and np.std(seg2, ddof=0)\
    \ > 1e-10:\n            autocorr[i] = np.corrcoef(seg1, seg2)[0, 1]\n        else:\n\
    \            autocorr[i] = 0.0\n\n    # 正自相关=趋势延续做动量，负自相关=均值回归做反转\n    signal\
    \ = np.tanh(autocorr * 2)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0),\
    \ -1.0, 1.0)"
