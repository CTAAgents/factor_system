- name: fut_volume_quality
  description: 成交量质量因子：成交量对价格变动的贡献度。量价配合好=趋势可靠做动量，量价背离=趋势可疑做反转。Wind平台量价分析核心。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    volume = data['volume'].values\
    \ if hasattr(data, 'volume') else data['volume']\n\n    window = int(params.get('window',\
    \ 20))\n\n    # 价格变动\n    price_chg = np.zeros(n)\n    price_chg[1:] = (close[1:]\
    \ - close[:-1]) / np.maximum(close[:-1], 1e-10)\n\n    # 成交量变化率\n    vol_chg =\
    \ np.zeros(n)\n    vol_chg[1:] = (volume[1:] - volume[:-1]) / np.maximum(volume[:-1],\
    \ 1e-10)\n\n    # 量价相关性（滚动）\n    vp_corr = np.zeros(n)\n    for i in range(window\
    \ + 1, n):\n        p_seg = price_chg[max(0, i-window+1):i+1]\n        v_seg =\
    \ vol_chg[max(0, i-window+1):i+1]\n        if len(p_seg) > 1 and np.std(p_seg,\
    \ ddof=0) > 1e-10 and np.std(v_seg, ddof=0) > 1e-10:\n            vp_corr[i] =\
    \ np.corrcoef(p_seg, v_seg)[0, 1]\n        else:\n            vp_corr[i] = 0.0\n\
    \n    # 涨时放量(+corr) = 趋势确认做动量\n    # 涨时缩量(-corr) = 趋势背离做反转\n    signal = vp_corr\
    \ * np.sign(price_chg)\n    signal = np.tanh(signal * 2)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
