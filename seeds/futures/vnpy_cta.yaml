    \ = (mfi >= 20) & (mfi <= 80)\n    signal[mid] = (20 + 80 - 2 * mfi[mid]) / 60.0\n\
    \    signal = np.tanh(signal * 0.5)\n\n    return np.clip(np.nan_to_num(signal,\
