- name: fut_rsi
  description: RSI因子：相对强弱指数。RSI<30超卖做多，RSI>70超买做空。CTA经典反转信号。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 14))\n    oversold = float(params.get('oversold', 30))\n    overbought = float(params.get('overbought',\
    \ 70))\n\n    # 计算价格变化\n    delta = np.zeros(n)\n    delta[1:] = close[1:] - close[:-1]\n\
    \n    # 上涨和下跌\n    gain = np.maximum(delta, 0)\n    loss = -np.minimum(delta,\
    \ 0)\n\n    # 平均上涨/下跌（SMA）\n    avg_gain = np.zeros(n)\n    avg_loss = np.zeros(n)\n\
    \n    for i in range(min(window, n)):\n        avg_gain[i] = np.mean(gain[max(0,\
    \ i-window+1):i+1]) if i > 0 else 0\n        avg_loss[i] = np.mean(loss[max(0,\
    \ i-window+1):i+1]) if i > 0 else 0\n\n    for i in range(window, n):\n      \
    \  avg_gain[i] = (avg_gain[i-1] * (window - 1) + gain[i]) / window\n        avg_loss[i]\
    \ = (avg_loss[i-1] * (window - 1) + loss[i]) / window\n\n    # RSI 计算\n    rs\
    \ = np.zeros(n)\n    mask = avg_loss > 1e-10\n    rs[mask] = avg_gain[mask] /\
    \ avg_loss[mask]\n    rsi = 100 - (100 / (1 + rs))\n\n    # 超买做空 (-1), 超卖做多 (+1)\n\
    \    signal = np.where(rsi > overbought, -1.0, np.where(rsi < oversold, 1.0, 0.0))\n\
    \    # 中间区域线性映射\n    mid_mask = (rsi >= oversold) & (rsi <= overbought)\n    signal[mid_mask]\
    \ = (oversold + overbought - 2 * rsi[mid_mask]) / (overbought - oversold)\n  \
    \  signal = np.tanh(signal * 0.5)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
  params:
    window: 14
    oversold: 30
    overbought: 70
  input_fields:
  - close
  lookback: 20
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 4
    microstructure: 3
    institutional: 3
    narrative: RSI因子：相对强弱指数。RSI<30超卖做多，RSI>70超买做空。CTA经典反转信号。
- name: fut_bollinger
  description: 布林带因子：价格突破上下轨做趋势跟踪，带宽收缩做均值回归。CTA经典波动率通道策略。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 20))\n    num_std = float(params.get('num_std', 2.0))\n\n    # 计算布林带\n    sma\
    \ = np.zeros(n)\n    std = np.zeros(n)\n    for i in range(window, n):\n     \
    \   seg = close[max(0, i-window+1):i+1]\n        sma[i] = np.mean(seg)\n     \
    \   std[i] = np.std(seg, ddof=0)\n\n    upper = sma + num_std * std\n    lower\
    \ = sma - num_std * std\n\n    # 价格突破上轨做多，突破下轨做空\n    # 越靠近上轨信号越正，越靠近下轨信号越负\n\
    \    bandwidth = np.maximum(upper - lower, 1e-10)\n    signal = (close - sma)\
    \ / (bandwidth / 2)\n    signal = np.clip(signal, -1.0, 1.0)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
  params:
    window: 20
    num_std: 2.0
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 4
    institutional: 3
