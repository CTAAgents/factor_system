- name: fut_ultosc
  description: Ultimate Oscillator因子：终极振荡器。多周期加权超买超卖判断。UO>70超买做空，UO<30超卖做多。CTA综合摆动指标。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    p1 = int(params.get('period1',\
    \ 7))\n    p2 = int(params.get('period2', 14))\n    p3 = int(params.get('period3',\
    \ 28))\n\n    def _calc_uo(arr_h, arr_l, arr_c, period):\n        n = len(arr_c)\n\
    \        bp = np.zeros(n)  # 买入压力\n        tr = np.zeros(n)  # 真实波动\n        for\
    \ i in range(1, n):\n            bp[i] = arr_c[i] - min(arr_l[i], arr_c[i-1])\n\
    \            tr[i] = max(arr_h[i], arr_c[i-1]) - min(arr_l[i], arr_c[i-1])\n \
    \       avg_bp = np.zeros(n)\n        avg_tr = np.zeros(n)\n        for i in range(period,\
    \ n):\n            avg_bp[i] = np.sum(bp[max(0, i-period+1):i+1])\n          \
    \  avg_tr[i] = np.sum(tr[max(0, i-period+1):i+1])\n        result = np.zeros(n)\n\
    \        mask = avg_tr > 1e-10\n        result[mask] = avg_bp[mask] / avg_tr[mask]\n\
    \        return result\n\n    uo1 = _calc_uo(high, low, close, p1)\n    uo2 =\
    \ _calc_uo(high, low, close, p2)\n    uo3 = _calc_uo(high, low, close, p3)\n\n\
    \    # UO = 4*UO1 + 2*UO2 + UO3\n    uo = (4 * uo1 + 2 * uo2 + uo3) / 7 * 100\n\
    \n    # UO>70 超买做空，UO<30 超卖做多\n    signal = np.where(uo > 70, -1.0, np.where(uo\
    \ < 30, 1.0, 0.0))\n    mid = (uo >= 30) & (uo <= 70)\n    signal[mid] = (30 +\
    \ 70 - 2 * uo[mid]) / 40.0\n    signal = np.tanh(signal * 0.5)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
