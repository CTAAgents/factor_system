- name: fut_cci
  description: CCI因子：商品通道指数。CCI>100超买做空，CCI<-100超卖做多。CTA经典摆动指标。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 20))\n\n    # 典型价格 = (H + L + C) / 3\n    tp = (high + low + close) / 3\n\n\
    \    # SMA of TP\n    sma_tp = np.zeros(n)\n    mean_dev = np.zeros(n)\n    for\
    \ i in range(window, n):\n        seg = tp[max(0, i-window+1):i+1]\n        sma_tp[i]\
    \ = np.mean(seg)\n        mean_dev[i] = np.mean(np.abs(seg - sma_tp[i]))\n\n \
    \   # CCI = (TP - SMA(TP)) / (0.015 * Mean Deviation)\n    cci = np.zeros(n)\n\
    \    denom = 0.015 * np.maximum(mean_dev, 1e-10)\n    cci[window:] = (tp[window:]\
    \ - sma_tp[window:]) / denom[window:]\n\n    # CCI>100 超买做空，CCI<-100 超卖做多\n  \
    \  signal = np.where(cci > 100, -1.0, np.where(cci < -100, 1.0, 0.0))\n    # 中间区域线性映射\n\
    \    mid = np.abs(cci) <= 100\n    signal[mid] = -cci[mid] / 100.0\n    signal\
    \ = np.tanh(signal * 0.5)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0),\
    \ -1.0, 1.0)"
