- name: fut_boll_squeeze
  description: 布林带收缩因子：带宽/价格比率。带宽收缩=蓄力突破，带宽扩张=趋势延续。CTA波动率周期判断。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 20))\n    num_std = float(params.get('num_std', 2.0))\n\n    # 计算布林带带宽\n   \
    \ bandwidth = np.zeros(n)\n    for i in range(window, n):\n        seg = close[max(0,\
    \ i-window+1):i+1]\n        sma = np.mean(seg)\n        std = np.std(seg, ddof=0)\n\
    \        bandwidth[i] = 2 * num_std * std / max(sma, 1e-10)\n\n    # 带宽的 Z-score\n\
    \    bw_mean = np.mean(bandwidth[max(0, n-100):n]) if n > 100 else np.mean(bandwidth[max(0,\
    \ n-window):n])\n    bw_std = np.std(bandwidth[max(0, n-100):n]) if n > 100 else\
    \ np.std(bandwidth[max(0, n-window):n])\n\n    if bw_std > 1e-10:\n        bw_z\
    \ = (bandwidth - bw_mean) / bw_std\n    else:\n        bw_z = np.zeros(n)\n\n\
    \    # 带宽收缩到极低 = 即将突破（做多/空方向由后续价格决定）\n    # 这里用带宽的负值：收缩蓄力偏正，扩张偏负\n    signal =\
    \ -np.tanh(bw_z * 0.5)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0,\
    \ 1.0)"
