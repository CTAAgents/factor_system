- name: fut_keltner
  description: 肯特纳通道因子：基于EMA+ATR的通道突破系统。突破上轨做多，突破下轨做空。CTA经典突破策略。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 20))\n    atr_window = int(params.get('atr_window', 10))\n    multiplier = float(params.get('multiplier',\
    \ 2.0))\n\n    # EMA 中线\n    alpha = 2.0 / (window + 1)\n    ema = np.zeros(n)\n\
    \    ema[0] = close[0]\n    for i in range(1, n):\n        ema[i] = alpha * close[i]\
    \ + (1 - alpha) * ema[i-1]\n\n    # ATR 计算\n    high_low = np.zeros(n)\n    high_close\
    \ = np.zeros(n)\n    low_close = np.zeros(n)\n    high_low[1:] = high[1:] - low[1:]\n\
    \    high_close[1:] = np.abs(high[1:] - close[:-1])\n    low_close[1:] = np.abs(low[1:]\
    \ - close[:-1])\n    tr = np.maximum(high_low, np.maximum(high_close, low_close))\n\
    \n    atr = np.zeros(n)\n    for i in range(min(atr_window, n)):\n        if i\
    \ > 0:\n            atr[i] = np.mean(tr[max(0, i-atr_window+1):i+1])\n    for\
    \ i in range(atr_window, n):\n        atr[i] = (atr[i-1] * (atr_window - 1) +\
    \ tr[i]) / atr_window\n\n    upper = ema + multiplier * atr\n    lower = ema -\
    \ multiplier * atr\n\n    # 突破上轨做多，突破下轨做空\n    signal = np.where(close > upper,\
    \ 1.0, np.where(close < lower, -1.0, 0.0))\n    # 通道内线性映射\n    in_channel = (close\
    \ >= lower) & (close <= upper)\n    half_width = np.maximum(upper - lower, 1e-10)\n\
    \    signal[in_channel] = 2 * (close[in_channel] - ema[in_channel]) / half_width[in_channel]\n\
    \n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
