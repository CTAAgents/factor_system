    \ 0.02))\n    max_acc = float(params.get('max_acceleration', 0.2))\n\n    # 简化\
    \ SAR 计算\n    sar = np.zeros(n)\n    ep = np.zeros(n)  # 极值点\n    af = np.zeros(n)\
    \  # 加速因子\n    trend = np.zeros(n)  # 1=上升, -1=下降\n\n    # 初始化\n    if n > 1:\n\
    \        trend[0] = 1 if close[0] <= close[1] else -1\n        if trend[0] > 0:\n\
    \            sar[0] = np.min(low[:2])\n            ep[0] = np.max(high[:2])\n\
    \        else:\n            sar[0] = np.max(high[:2])\n            ep[0] = np.min(low[:2])\n\
    \        af[0] = acceleration\n\n    for i in range(1, n):\n        sar[i] = sar[i-1]\
    \ + af[i-1] * (ep[i-1] - sar[i-1])\n\n        if trend[i-1] > 0:  # 上升趋势\n   \
    \         sar[i] = min(sar[i], low[i-1], low[i-2] if i >= 2 else low[i-1])\n \
    \       else:  # 下降趋势\n            sar[i] = max(sar[i], high[i-1], high[i-2] if\
