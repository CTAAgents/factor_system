- name: fut_wma_cross
  description: WMA交叉因子：加权移动平均价格位置。价格在WMA上方做多，下方做空。CTA趋势跟踪。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 20))\n\n    # WMA 计算\n    weights = np.arange(1, window + 1, dtype=float)\n\
    \    wma = np.zeros(n)\n    for i in range(window, n):\n        seg = close[max(0,\
    \ i-window+1):i+1]\n        wma[i] = np.sum(seg * weights) / np.sum(weights)\n\
    \n    # 价格在 WMA 上方做多，下方做空\n    signal = np.where(close > wma, 1.0, -1.0)\n   \
    \ # 距 WMA 距离归一化\n    dist = (close - wma) / np.maximum(wma, 1e-10)\n    signal\
    \ = np.tanh(dist * 20)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0,\
    \ 1.0)"
