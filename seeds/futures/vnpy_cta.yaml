    \    low_close = np.zeros(n)\n    high_low[1:] = high[1:] - low[1:]\n    high_close[1:]\
    \ = np.abs(high[1:] - close[:-1])\n    low_close[1:] = np.abs(low[1:] - close[:-1])\n\
    \    tr = np.maximum(high_low, np.maximum(high_close, low_close))\n\n    atr =\
