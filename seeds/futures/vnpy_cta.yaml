    \ hasattr(data, 'volume') else data['volume']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # 典型价格\n    tp = (high + low + close) / 3\n\n    # 资金流 = TP * Volume\n\
    \    money_flow = tp * volume\n\n    # 正/负资金流\n    pos_mf = np.zeros(n)\n    neg_mf\
    \ = np.zeros(n)\n    for i in range(1, n):\n        if tp[i] > tp[i-1]:\n    \
    \        pos_mf[i] = money_flow[i]\n        elif tp[i] < tp[i-1]:\n          \
    \  neg_mf[i] = money_flow[i]\n\n    # MF Ratio = Sum(Positive MF) / Sum(Negative\
    \ MF)\n    mfr = np.zeros(n)\n    for i in range(window, n):\n        pos_sum\
    \ = np.sum(pos_mf[max(0, i-window+1):i+1])\n        neg_sum = np.sum(neg_mf[max(0,\
    \ i-window+1):i+1])\n        if neg_sum > 1e-10:\n            mfr[i] = pos_sum\
    \ / neg_sum\n        else:\n            mfr[i] = 100.0\n\n    # MFI = 100 - 100\
    \ / (1 + MFR)\n    mfi = 100 - 100 / (1 + mfr)\n\n    # MFI>80 超买做空，MFI<20 超卖做多\n\
