- name: fut_adx
  description: ADX因子：平均趋向指数。ADX>25=强趋势做动量，ADX<20=弱趋势做反转。CTA趋势强度判断核心。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # 计算方向运动\n    up_move = np.zeros(n)\n    down_move = np.zeros(n)\n\
    \    up_move[1:] = high[1:] - high[:-1]\n    down_move[1:] = low[:-1] - low[1:]\n\
    \n    plus_dm = np.zeros(n)\n    minus_dm = np.zeros(n)\n    for i in range(1,\
    \ n):\n        if up_move[i] > down_move[i] and up_move[i] > 0:\n            plus_dm[i]\
    \ = up_move[i]\n        if down_move[i] > up_move[i] and down_move[i] > 0:\n \
    \           minus_dm[i] = down_move[i]\n\n    # ATR 用于归一化\n    high_low = np.zeros(n)\n\
    \    high_close = np.zeros(n)\n    low_close = np.zeros(n)\n    high_low[1:] =\
    \ high[1:] - low[1:]\n    high_close[1:] = np.abs(high[1:] - close[:-1])\n   \
    \ low_close[1:] = np.abs(low[1:] - close[:-1])\n    tr = np.maximum(high_low,\
    \ np.maximum(high_close, low_close))\n\n    # 平滑\n    atr = np.zeros(n)\n    pdi\
    \ = np.zeros(n)\n    ndi = np.zeros(n)\n    for i in range(min(window, n)):\n\
    \        if i > 0:\n            atr[i] = np.mean(tr[max(0, i-window+1):i+1])\n\
    \            pdi[i] = 100 * np.mean(plus_dm[max(0, i-window+1):i+1]) / max(atr[i],\
    \ 1e-10)\n            ndi[i] = 100 * np.mean(minus_dm[max(0, i-window+1):i+1])\
    \ / max(atr[i], 1e-10)\n    for i in range(window, n):\n        atr[i] = (atr[i-1]\
    \ * (window - 1) + tr[i]) / window\n        pdi[i] = 100 * (pdi[i-1] * (window\
    \ - 1) + plus_dm[i]) / max(atr[i] * window, 1e-10)\n        ndi[i] = 100 * (ndi[i-1]\
    \ * (window - 1) + minus_dm[i]) / max(atr[i] * window, 1e-10)\n\n    # ADX = abs(+DI\
    \ - -DI) / (+DI + -DI) 的平滑\n    dx = np.zeros(n)\n    di_sum = pdi + ndi\n   \
    \ mask = di_sum > 1e-10\n    dx[mask] = 100 * np.abs(pdi[mask] - ndi[mask]) /\
    \ di_sum[mask]\n\n    adx = np.zeros(n)\n    for i in range(min(window, n)):\n\
    \        if i > 0:\n            adx[i] = np.mean(dx[max(0, i-window+1):i+1])\n\
    \    for i in range(window, n):\n        adx[i] = (adx[i-1] * (window - 1) + dx[i])\
    \ / window\n\n    # ADX>25 强趋势做动量方向，ADX<20 弱趋势偏向反转\n    # 结合 +DI/-DI 方向\n    trend_bias\
    \ = np.where(pdi > ndi, 1.0, -1.0)\n    signal = np.where(adx > 25, trend_bias,\
    \ np.where(adx < 20, -trend_bias * 0.5, 0.0))\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
