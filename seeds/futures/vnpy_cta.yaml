- name: fut_williams
  description: 威廉%R因子：Williams %R。%R>-20超买做空，%R<-80超卖做多。CTA短线反转信号。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # Williams %R = (HH - Close) / (HH - LL) * -100\n    wr = np.zeros(n)\n\
    \    for i in range(window, n):\n        hh = np.max(high[max(0, i-window+1):i+1])\n\
    \        ll = np.min(low[max(0, i-window+1):i+1])\n        if hh > ll:\n     \
    \       wr[i] = -100 * (hh - close[i]) / (hh - ll)\n        else:\n          \
    \  wr[i] = -50\n\n    # %R > -20 超买做空，%R < -80 超卖做多\n    signal = np.where(wr\
