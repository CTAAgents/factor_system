    \ < sar[i]:\n            trend[i] = -1\n            sar[i] = ep[i-1]\n       \
    \     ep[i] = low[i]\n            af[i] = acceleration\n        elif trend[i-1]\
    \ < 0 and close[i] > sar[i]:\n            trend[i] = 1\n            sar[i] = ep[i-1]\n\
    \            ep[i] = high[i]\n            af[i] = acceleration\n        else:\n\
    \            trend[i] = trend[i-1]\n            af[i] = min(af[i-1] + acceleration,\
    \ max_acc)\n            if trend[i] > 0:\n                ep[i] = max(ep[i-1],\
    \ high[i])\n            else:\n                ep[i] = min(ep[i-1], low[i])\n\n\
    \    # 价格在SAR上方做多，下方做空\n    signal = np.where(close > sar, np.tanh((close - sar)\
    \ / np.maximum(sar, 1e-10) * 10),\n                      -np.tanh((sar - close)\
    \ / np.maximum(sar, 1e-10) * 10))\n\n    return np.clip(np.nan_to_num(signal,\
