    \ (ema3[1:] - ema3[:-1]) / np.maximum(ema3[:-1], 1e-10) * 100\n\n    # Signal\
    \ 线\n    signal_line = _ema(trix, signal_window)\n\n    # TRIX > Signal 做多，< Signal\
    \ 做空\n    signal = np.tanh((trix - signal_line) * 2)\n\n    return np.clip(np.nan_to_num(signal,\
