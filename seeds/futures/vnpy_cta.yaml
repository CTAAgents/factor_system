- name: fut_donchian
  description: 唐奇安通道因子：N日最高价突破做多，N日最低价突破做空。海龟交易法则核心。CTA经典趋势跟踪系统。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 20))\n\n    # 计算唐奇安通道\n    upper = np.zeros(n)\n    lower = np.zeros(n)\n  \
    \  mid = np.zeros(n)\n    for i in range(window, n):\n        upper[i] = np.max(high[max(0,\
    \ i-window+1):i+1])\n        lower[i] = np.min(low[max(0, i-window+1):i+1])\n\
    \        mid[i] = (upper[i] + lower[i]) / 2\n\n    # 突破上轨做多，突破下轨做空\n    signal\
    \ = np.where(close > upper, 1.0, np.where(close < lower, -1.0, 0.0))\n    # 通道内：价格在通道中的位置\n\
    \    in_channel = (close >= lower) & (close <= upper) & (upper > lower)\n    range_width\
    \ = np.maximum(upper[in_channel] - lower[in_channel], 1e-10)\n    signal[in_channel]\
    \ = 2 * (close[in_channel] - mid[in_channel]) / range_width\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
