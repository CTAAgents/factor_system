- name: fut_kdj
  description: KDJ因子：随机指标。K线向上突破D线金叉做多，死叉做空。CTA经典短线反转信号。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    k_window = int(params.get('k_window',\
    \ 9))\n    d_window = int(params.get('d_window', 3))\n\n    # 计算 K 值\n    k =\
    \ np.zeros(n)\n    for i in range(k_window, n):\n        hh = np.max(high[max(0,\
    \ i-k_window+1):i+1])\n        ll = np.min(low[max(0, i-k_window+1):i+1])\n  \
    \      if hh > ll:\n            k[i] = 100 * (close[i] - ll) / (hh - ll)\n   \
    \     else:\n            k[i] = 50\n\n    # D 值 = K 的 SMA\n    d = np.zeros(n)\n\
    \    for i in range(d_window, n):\n        d[i] = np.mean(k[max(0, i-d_window+1):i+1])\n\
    \n    # K > D 金叉做多，K < D 死叉做空\n    # 超买区 (K>80) 做空，超卖区 (K<20) 做多\n    signal =\
    \ np.where(k > 80, -1.0, np.where(k < 20, 1.0, 0.0))\n    # 结合 K-D 交叉\n    crossover\
    \ = np.sign(k - d)\n    zero_mask = np.abs(signal) < 0.01\n    signal[zero_mask]\
    \ = crossover[zero_mask] * 0.5\n\n    return np.clip(np.nan_to_num(signal, nan=0.0),\
    \ -1.0, 1.0)"
