market: futures
factors:
- name: fut_momentum_decay
  description: 动量衰减因子：加权移动平均收益率，给近期更高权重。相比等权动量，更敏感于近期变化。来源：中信期货CTA风格因子手册。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            # 指数衰减权重
            decay = np.exp(-np.arange(window) / (window / 3))
            decay /= decay.sum()
            sig = np.zeros(n)
            for i in range(window, n):
                sig[i] = np.sum(ret[i - window : i] * decay)
            sig = np.tanh(sig / 0.01)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: 动量衰减因子：加权移动平均收益率，给近期更高权重。相比等权动量，更敏感于近期变化。
- name: fut_momentum_acceleration
  description: 动量加速度因子：收益率的二阶差分，衡量动量变化速度。动量加速=趋势强化。来源：中信期货CTA风格因子手册。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 10))
            if n < window + 3:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            # 动量 = 滚动收益率均值
            mom = np.zeros(n)
            for i in range(window, n):
                mom[i] = np.mean(ret[i - window : i])
            # 加速度 = 动量的变化
            accel = np.diff(mom)
            sig = np.zeros(n)
            sig[window+1:] = np.tanh(accel[window-1:] * 100)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 10
  input_fields:
  - close
  lookback: 15
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: 动量加速度因子：收益率的二阶差分，衡量动量变化速度。动量加速=趋势强化。
- name: fut_volume_price_corr
  description: 量价相关性因子：价格变化与成交量的滚动相关性。量价齐升=趋势健康，量缩价涨=趋势衰竭。来源：中信期货CTA风格因子手册。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            vol_change = np.diff(volume) / np.maximum(volume[:-1], 1e-10)
            min_len = min(len(ret), len(vol_change))
            corr = np.zeros(n)
            for i in range(window, n):
                r_seg = ret[max(0, i - window + 1):i]
                v_seg = vol_change[max(0, i - window + 1):i]
                if len(r_seg) > 2 and np.std(r_seg) > 1e-10 and np.std(v_seg) > 1e-10:
                    corr[i] = np.corrcoef(r_seg, v_seg)[0, 1]
            sig = np.tanh(corr * 2)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 3
    microstructure: 4
    institutional: 3
    narrative: 量价相关性因子：价格变化与成交量的滚动相关性。量价齐升=趋势健康，量缩价涨=趋势衰竭。
- name: fut_volume_weighted_momentum
  description: 成交量加权动量因子：用成交量作为权重的加权收益率，放量日的影响更大。来源：中信期货CTA风格因子手册。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            sig = np.zeros(n)
            for i in range(window, n):
                r_seg = ret[i - window : i]
                v_seg = volume[i - window + 1 : i + 1]
                w = v_seg / np.maximum(np.sum(v_seg), 1e-10)
                sig[i] = np.sum(r_seg * w)
            sig = np.tanh(sig / 0.01)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 3
    microstructure: 4
    institutional: 3
    narrative: 成交量加权动量因子：用成交量作为权重的加权收益率，放量日的影响更大。
- name: fut_vol_asymmetry
  description: 波动率不对称性因子：上涨日波动率与下跌日波动率的比值。下跌波动更大=恐慌=做空信号。来源：中信期货CTA风格因子手册。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            sig = np.zeros(n)
            for i in range(window, n):
                seg = ret[i - window : i]
                up_vol = np.std(seg[seg > 0]) if np.sum(seg > 0) > 2 else 0.01
                down_vol = np.std(seg[seg < 0]) if np.sum(seg < 0) > 2 else 0.01
                ratio = down_vol / max(up_vol, 1e-10)
                sig[i] = np.tanh((ratio - 1) * 2)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 4
    microstructure: 3
    institutional: 3
    narrative: 波动率不对称性因子：上涨日波动率与下跌日波动率的比值。下跌波动更大=恐慌=做空。
- name: fut_realized_vol_trend
  description: 已实现波动率趋势因子：已实现波动率的短期与长期比值。短期波动>长期=波动加剧=谨慎。来源：中信期货CTA风格因子手册。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            short_w = int(params.get('short_window', 5))
            long_w = int(params.get('long_window', 20))
            if n < long_w + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            sig = np.zeros(n)
            for i in range(long_w, n):
                short_vol = np.std(ret[i - short_w : i])
                long_vol = np.std(ret[i - long_w : i])
                ratio = short_vol / max(long_vol, 1e-10)
                sig[i] = np.tanh((ratio - 1) * 3)
            return np.clip(sig, -1.0, 1.0)
  params:
    short_window: 5
    long_window: 20
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: 已实现波动率趋势因子：已实现波动率的短期与长期比值。短期波动>长期=波动加剧=谨慎。
- name: fut_oi_momentum_ratio
  description: 持仓动量比因子：持仓变化与价格变化的比值，衡量资金流与价格方向的一致性。比值高=资金推动型趋势。来源：中信建投期货。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            hold = data['hold'].values if hasattr(data, 'hold') else data.get('hold', np.ones(n))
            n = len(close)
            window = int(params.get('window', 10))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            oi_chg = np.diff(hold) / np.maximum(hold[:-1], 1e-10)
            sig = np.zeros(n)
            for i in range(window, n):
                r = np.mean(ret[i - window : i])
                o = np.mean(oi_chg[i - window : i])
                if abs(r) > 1e-10:
                    sig[i] = o / r
            sig = np.tanh(sig * 0.5)
            return np.clip(sig, -1.0, 1.0)
  params:
    window: 10
  input_fields:
  - close
  - hold
  lookback: 15
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 3
    microstructure: 4
    institutional: 4
    narrative: 持仓动量比因子：持仓变化与价格变化的比值，衡量资金流与价格方向的一致性。
