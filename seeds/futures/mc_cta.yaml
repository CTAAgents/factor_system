    \ np.zeros(n))\n\n    window = int(params.get('window', 14))\n    mult = float(params.get('mult',\
    \ 100))\n\n    # Herrick Payoff Index\n    # HPI = mult * (成交量 * (价格变动) * (1 -\
    \ |价格变动|))\n    # 使用持仓量作为权重\n\n    price_change = np.zeros(n)\n    price_change[1:]\
    \ = close[1:] - close[:-1]\n    price_range = np.maximum(high - low, 1e-10)\n\
    \    mid = (high + low) / 2.0\n\n    hpi = np.zeros(n)\n    for i in range(1,\
