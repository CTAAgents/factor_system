  lookback: 40
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: KST因子：Know Sure Thing，多周期ROC合成。上穿零轴偏多，下穿偏空。
- name: fut_coppock
  description: Coppock Curve因子：长期趋势变化检测。Coppock上穿零轴=长期趋势转多，下穿=长期趋势转空。MC经典长期趋势指标。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    roc_window = int(params.get('roc_window',\
    \ 14))\n    wma_window = int(params.get('wma_window', 10))\n\n    # 长期ROC\n  \
    \  roc_long = np.zeros(n)\n    roc_short = np.zeros(n)\n    for i in range(roc_window,\
    \ n):\n        roc_long[i] = (close[i] / np.maximum(close[max(0, i-roc_window)],\
    \ 1e-10) - 1) * 100\n    for i in range(roc_window // 2, n):\n        roc_short[i]\
    \ = (close[i] / np.maximum(close[max(0, i-roc_window//2)], 1e-10) - 1) * 100\n\
    \n    # RoC = 14个月ROC + 11个月ROC (按月近似)\n    # 日线近似: 14天ROC + 11天ROC\n    roc_sum\
    \ = roc_long + roc_short\n\n    # 加权移动平均\n    coppock = np.zeros(n)\n    for i\
    \ in range(wma_window, n):\n        weights = np.arange(1, wma_window + 1)\n \
    \       seg = roc_sum[max(0, i-wma_window+1):i+1]\n        if len(seg) == wma_window:\n\
    \            coppock[i] = np.sum(seg * weights) / np.sum(weights)\n\n    # Coppock上穿零轴=偏多，下穿=偏空\n\
    \    signal = np.tanh(coppock * 0.1)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
  params:
