    narrative: Coppock Curve因子：长期趋势变化检测，上穿零轴偏多，下穿零轴偏空。
- name: fut_market_facilitation
  description: 市场促进指数因子：Bill Williams MFI，量价关系分析。量价齐升=有效突破偏多，量缩价升=弱势偏空。MC Bill Williams经典因子。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n    volume = data['volume'].values if\
    \ hasattr(data, 'volume') else data['volume']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # 市场促进指数 = (最高-最低) / 成交量\n    range_ = np.maximum(high - low, 1e-10)\n\
    \    volume_safe = np.maximum(volume + 1e-10, 1e-10)\n    mf = range_ / volume_safe\n\
    \n    # 价格变化方向\n    price_change = np.zeros(n)\n    price_change[1:] = close[1:]\
    \ - close[:-1]\n\n    # 量价关系评分\n    # 量增价涨 = +1 (有效突破), 量增价跌 = -1 (有效下跌)\n   \
    \ # 量缩价涨 = -0.5 (弱势反弹), 量缩价跌 = +0.5 (缩量整理)\n    signal_raw = np.zeros(n)\n   \
    \ for i in range(1, n):\n        vol_up = volume[i] > np.mean(volume[max(0, i-window):i])\
    \ if i >= window else True\n        if price_change[i] > 0 and vol_up:\n     \
    \       signal_raw[i] = 1.0\n        elif price_change[i] < 0 and vol_up:\n  \
    \          signal_raw[i] = -1.0\n        elif price_change[i] > 0 and not vol_up:\n\
    \            signal_raw[i] = -0.5\n        elif price_change[i] < 0 and not vol_up:\n\
    \            signal_raw[i] = 0.5\n\n    signal = np.tanh(signal_raw)\n\n    return\
    \ np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
