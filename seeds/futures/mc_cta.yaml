    \ in range(periods[-1], n):\n            vals = [m[i] for m in mas]\n        \
    \    spread[i] = (np.max(vals) - np.min(vals)) / np.maximum(np.min(vals), 1e-10)\n\
    \n        # 价格在均线带中的位置\n        pos = np.zeros(n)\n        for i in range(periods[-1],\
