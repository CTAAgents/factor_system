    narrative: MAMA因子：MESA Adaptive Moving Average，自适应调整周期。MAMA上穿FAMA=偏多，下穿=偏空。
- name: fut_ehlers_corr_cycle
  description: Ehlers相关周期因子：自相关周期检测，识别市场循环周期。周期短=趋势强=偏多，周期长=震荡=偏空。MC Ehlers系列周期检测。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 20))\n    max_cycle = int(params.get('max_cycle', 40))\n\n    # 计算自相关周期\n  \
    \  cycle_quality = np.zeros(n)\n    for i in range(window * 2, n):\n        seg\
    \ = close[max(0, i-window+1):i+1]\n        seg_mean = np.mean(seg)\n        seg_std\
    \ = np.std(seg, ddof=0)\n        if seg_std < 1e-10:\n            continue\n \
    \       seg_norm = (seg - seg_mean) / seg_std\n\n        # 自相关计算\n        best_corr\
    \ = 0\n        best_lag = 0\n        for lag in range(2, min(max_cycle, len(seg_norm)\
    \ // 2)):\n            corr = np.corrcoef(seg_norm[:-lag], seg_norm[lag:])[0,\
    \ 1]\n            if np.abs(corr) > np.abs(best_corr):\n                best_corr\
    \ = corr\n                best_lag = lag\n\n        # 周期短=趋势强=偏多，周期长=震荡=偏空\n \
    \       if best_lag > 0:\n            cycle_quality[i] = np.abs(best_corr) / np.maximum(best_lag,\
    \ 1)\n\n    signal = np.tanh(cycle_quality * 5 - 2)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
  params:
    window: 20
    max_cycle: 40
  input_fields:
  - close
  lookback: 50
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 2
    narrative: Ehlers相关周期因子：自相关周期检测，周期短=趋势强偏多，周期长=震荡偏空。
- name: fut_choppiness_index
  description: 混沌指数因子：Choppiness Index，市场趋势vs震荡判断。CI<38.2=趋势市场偏多，CI>61.8=震荡市场偏空。MC经典市场状态滤波器。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # Choppiness Index 计算\n    tr = np.zeros(n)\n    for i in range(1,\
    \ n):\n        tr[i] = np.max([\n            high[i] - low[i],\n            np.abs(high[i]\
    \ - close[i-1]),\n            np.abs(low[i] - close[i-1])\n        ])\n\n    atr\
    \ = np.zeros(n)\n    for i in range(window, n):\n        atr[i] = np.mean(tr[max(0,\
    \ i-window+1):i+1])\n\n    highest = np.zeros(n)\n    lowest = np.zeros(n)\n \
    \   for i in range(window, n):\n        highest[i] = np.max(high[max(0, i-window+1):i+1])\n\
    \        lowest[i] = np.min(low[max(0, i-window+1):i+1])\n\n    # CI = sum(TR)\
    \ / (最高 - 最低) 的对数标准化\n    sum_tr = np.zeros(n)\n    for i in range(window, n):\n\
    \        sum_tr[i] = np.sum(tr[max(0, i-window+1):i+1])\n\n    range_ = np.maximum(highest\
    \ - lowest, 1e-10)\n    ci = 100 * np.log(sum_tr / range_) / np.log(window + 1)\n\
    \n    # CI < 38.2 = 趋势市场做多, CI > 61.8 = 震荡市场做空\n    signal = np.where(ci < 38.2,\
    \ 1.0, np.where(ci > 61.8, -1.0, 0.0))\n    mid_mask = (ci >= 38.2) & (ci <= 61.8)\n\
    \    signal[mid_mask] = (61.8 + 38.2 - 2 * ci[mid_mask]) / (61.8 - 38.2)\n   \
    \ signal = np.tanh(signal * 0.5)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0),\
    \ -1.0, 1.0)"
  params:
    window: 14
  input_fields:
  - close
  - high
  - low
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 4
    microstructure: 3
    institutional: 3
    narrative: 混沌指数因子：CI<38.2=趋势偏多，CI>61.8=震荡偏空。MC经典市场状态滤波器。
- name: fut_vortex
  description: Vortex Indicator因子：趋势方向检测。VI+上穿VI- = 上升趋势偏多，VI-上穿VI+ = 下降趋势偏空。MC经典趋势检测因子。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 14))\n\n    # Vortex Indicator 计算\n    vm_plus = np.zeros(n)\n    vm_minus =\
    \ np.zeros(n)\n    tr = np.zeros(n)\n\n    for i in range(1, n):\n        vm_plus[i]\
    \ = np.abs(high[i] - low[i-1])\n        vm_minus[i] = np.abs(low[i] - high[i-1])\n\
    \        tr[i] = np.max([\n            high[i] - low[i],\n            np.abs(high[i]\
    \ - close[i-1]),\n            np.abs(low[i] - close[i-1])\n        ])\n\n    sum_vp\
    \ = np.zeros(n)\n    sum_vm = np.zeros(n)\n    sum_tr = np.zeros(n)\n\n    for\
    \ i in range(window, n):\n        sum_vp[i] = np.sum(vm_plus[max(0, i-window+1):i+1])\n\
    \        sum_vm[i] = np.sum(vm_minus[max(0, i-window+1):i+1])\n        sum_tr[i]\
    \ = np.sum(tr[max(0, i-window+1):i+1])\n\n    vi_plus = np.where(sum_tr > 1e-10,\
    \ sum_vp / sum_tr, 0)\n    vi_minus = np.where(sum_tr > 1e-10, sum_vm / sum_tr,\
    \ 0)\n\n    # VI+ > VI- = 偏多, VI- > VI+ = 偏空\n    signal = vi_plus - vi_minus\n\
    \    signal = np.tanh(signal * 3)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
  params:
    window: 14
  input_fields:
  - close
  - high
  - low
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: Vortex Indicator因子：VI+上穿VI-偏多，VI-上穿VI+偏空。MC经典趋势检测。
- name: fut_kst
  description: KST因子：Know Sure Thing，多周期ROC合成指标。KST上穿零轴=偏多，下穿零轴=偏空。MC经典多周期趋势指标。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    r1 = int(params.get('r1',\
    \ 10))\n    r2 = int(params.get('r2', 15))\n    r3 = int(params.get('r3', 20))\n\
    \    r4 = int(params.get('r4', 30))\n\n    # 多周期ROC\n    roc = np.zeros(n)\n \
    \   roc[1:] = close[1:] / np.maximum(close[:-1], 1e-10) - 1\n\n    # 四个周期SMA\n\
    \    sma1 = np.zeros(n)\n    sma2 = np.zeros(n)\n    sma3 = np.zeros(n)\n    sma4\
    \ = np.zeros(n)\n\n    for i in range(r1, n):\n        sma1[i] = np.mean(roc[max(0,\
    \ i-r1+1):i+1])\n    for i in range(r2, n):\n        sma2[i] = np.mean(roc[max(0,\
    \ i-r2+1):i+1])\n    for i in range(r3, n):\n        sma3[i] = np.mean(roc[max(0,\
    \ i-r3+1):i+1])\n    for i in range(r4, n):\n        sma4[i] = np.mean(roc[max(0,\
    \ i-r4+1):i+1])\n\n    # KST = 1*SMA1 + 2*SMA2 + 3*SMA3 + 4*SMA4\n    kst = sma1\
    \ + 2 * sma2 + 3 * sma3 + 4 * sma4\n    signal = np.tanh(kst * 50)\n\n    return\
    \ np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
  params:
    r1: 10
    r2: 15
    r3: 20
    r4: 30
  input_fields:
