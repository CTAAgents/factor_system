- name: fut_t3_ma
  description: T3移动平均因子：Tillson T3 MA，比传统EMA更平滑，减少滞后和噪声。T3>价格=偏多，T3<价格=偏空。MultiCharts
    PowerLanguage经典平滑指标。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    window = int(params.get('window',\
    \ 14))\n    v_factor = float(params.get('v_factor', 0.7))\n\n    # T3 移动平均计算 (Tillson\
    \ T3)\n    # T3 = GD(GD(GD(close))), GD = EMA(EMA(price))\n    def ema(series,\
    \ period):\n        result = np.zeros_like(series)\n        result[0] = series[0]\n\
    \        alpha = 2.0 / (period + 1)\n        for i in range(1, len(series)):\n\
    \            result[i] = alpha * series[i] + (1 - alpha) * result[i-1]\n     \
    \   return result\n\n    c1 = -v_factor ** 3\n    c2 = 3 * v_factor ** 2 + 3 *\
    \ v_factor ** 3\n    c3 = -6 * v_factor ** 2 - 3 * v_factor - 3 * v_factor **\
    \ 3\n    c4 = 1 + 3 * v_factor + v_factor ** 3 + 3 * v_factor ** 2\n\n    e1 =\
    \ ema(close, window)\n    e2 = ema(e1, window)\n    e3 = ema(e2, window)\n   \
    \ e4 = ema(e3, window)\n    e5 = ema(e4, window)\n    e6 = ema(e5, window)\n\n\
    \    t3 = c1 * e6 + c2 * e5 + c3 * e4 + c4 * e3\n\n    # 价格相对于T3的位置：T3<价格=偏多，T3>价格=偏空\n\
    \    signal = (close - t3) / np.maximum(close, 1e-10)\n    signal = np.tanh(signal\
    \ * 50)\n\n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
  params:
    window: 14
    v_factor: 0.7
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 3
    microstructure: 3
    institutional: 3
    narrative: T3移动平均因子：Tillson T3 MA，比传统EMA更平滑，减少滞后和噪声。T3<价格=偏多，T3>价格=偏空。
- name: fut_fisher_transform
  description: Fisher Transform因子：Ehlers Fisher Transform，将价格正态化。极端值>2=做空，<-2=做多。MC
    Ehlers系列经典指标，识别价格转折点。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 10))\n\n    # 计算中间价\n    mid = (high + low) / 2.0\n\n    # 滚动窗口极值\n    hp =\
    \ np.zeros(n)\n    lp = np.zeros(n)\n    for i in range(window, n):\n        hp[i]\
    \ = np.max(mid[max(0, i-window+1):i+1])\n        lp[i] = np.min(mid[max(0, i-window+1):i+1])\n\
    \n    # Fisher Transform\n    value = np.zeros(n)\n    for i in range(window,\
    \ n):\n        range_ = hp[i] - lp[i]\n        if range_ > 1e-10:\n          \
    \  raw = 2.0 * (mid[i] - lp[i]) / range_ - 1.0\n            # 钳制\n           \
    \ raw = np.clip(raw, -0.999, 0.999)\n            value[i] = 0.5 * np.log((1 +\
    \ raw) / (1 - raw))\n        else:\n            value[i] = value[i-1] if i > 0\
    \ else 0.0\n\n    # Fisher > 2 偏空, < -2 偏多\n    signal = -np.tanh(value * 0.5)\n\
    \n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
  params:
    window: 10
  input_fields:
  - close
  - high
  - low
  lookback: 20
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 4
    microstructure: 3
