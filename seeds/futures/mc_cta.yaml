    narrative: Fisher Transform因子：Ehlers Fisher Transform，将价格正态化。极端值>2偏空，<-2偏多。
- name: fut_mama
  description: MAMA因子：MESA Adaptive Moving Average，自适应调整周期。快速MAMA上穿慢速FAMA=偏多，下穿=偏空。MC
    Ehlers系列自适应均线。
  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n\n    fast_limit = float(params.get('fast_limit',\
    \ 0.5))\n    slow_limit = float(params.get('slow_limit', 0.05))\n\n    # MAMA\
    \ 计算 (MESA Adaptive Moving Average)\n    # 使用相位变化检测自适应周期\n    alpha = slow_limit\
    \ * np.ones(n)\n    mama = np.zeros(n)\n    fama = np.zeros(n)\n    mama[0] =\
    \ close[0]\n    fama[0] = close[0]\n\n    for i in range(4, n):\n        # Hilbert\
    \ Transform 相位检测\n        smooth = (4 * close[i] + 3 * close[i-1] + 2 * close[i-2]\
    \ + close[i-3]) / 10.0\n        if i >= 6:\n            detrender = (0.0962 *\
    \ smooth + 0.5769 * smooth + 0.5769 * smooth + 0.0962 * smooth) / 2.0  # 简化\n\
    \        # 自适应 alpha\n        alpha[i] = fast_limit / (1 + np.exp(-10 * (close[i]\
    \ - close[i-1]) / np.maximum(close[i-1], 1e-10)))\n        alpha[i] = np.clip(alpha[i],\
    \ slow_limit, fast_limit)\n\n        mama[i] = alpha[i] * close[i] + (1 - alpha[i])\
    \ * mama[i-1]\n        fama[i] = 0.5 * alpha[i] * mama[i] + (1 - 0.5 * alpha[i])\
    \ * fama[i-1]\n\n    # MAMA 上穿 FAMA = 偏多，下穿 = 偏空\n    signal = (mama - fama) /\
    \ np.maximum(close, 1e-10)\n    signal = np.tanh(signal * 50)\n\n    return np.clip(np.nan_to_num(signal,\
    \ nan=0.0), -1.0, 1.0)"
  params:
    fast_limit: 0.5
    slow_limit: 0.05
  input_fields:
