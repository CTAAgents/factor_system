  market: futures
  code: "def factor_program(data, params):\n    import numpy as np\n    n = len(data['close'].values\
    \ if hasattr(data, 'close') else data['close'])\n\n    close = data['close'].values\
    \ if hasattr(data, 'close') else data['close']\n    high = data['high'].values\
    \ if hasattr(data, 'high') else data['high']\n    low = data['low'].values if\
    \ hasattr(data, 'low') else data['low']\n\n    window = int(params.get('window',\
    \ 10))\n    confirm = int(params.get('confirm', 3))\n\n    # 123 反转形态识别\n    #\
    \ 上升123: 1=高点, 2=回调低点, 3=突破前高 -> 偏多\n    # 下降123: 1=低点, 2=反弹高点, 3=跌破前低 -> 偏空\n\
    \n    signal = np.zeros(n)\n    for i in range(window * 2, n):\n        # 最近window天的高点/低点\n\
    \        seg_h = high[max(0, i-window*2):i]\n        seg_l = low[max(0, i-window*2):i]\n\
    \        seg_c = close[max(0, i-window*2):i]\n\n        # 寻找最近的高点(1)和回调低点(2)\n\
    \        h1_idx = np.argmax(seg_h)\n        l2_idx = np.argmin(seg_l[h1_idx:])\
    \ + h1_idx if h1_idx < len(seg_l) - 1 else h1_idx\n\n        # 下降123: 1=低点, 2=反弹高点,\
    \ 3=突破前低\n        l1_idx = np.argmin(seg_l)\n        h2_idx = np.argmax(seg_h[l1_idx:])\
    \ + l1_idx if l1_idx < len(seg_h) - 1 else l1_idx\n\n        # 上升123: 价格突破前高\n\
    \        if h1_idx < l2_idx < len(seg_c) - 1:\n            if seg_c[-1] > seg_h[h1_idx]\
    \ and seg_c[l2_idx] < seg_c[h1_idx]:\n                signal[i] = 1.0  # 突破前高\
    \ = 偏多\n\n        # 下降123: 价格跌破前低\n        if l1_idx < h2_idx < len(seg_c) - 1:\n\
    \            if seg_c[-1] < seg_l[l1_idx] and seg_c[h2_idx] > seg_c[l1_idx]:\n\
    \                signal[i] = -1.0  # 跌破前低 = 偏空\n\n    signal = np.tanh(signal)\n\
    \n    return np.clip(np.nan_to_num(signal, nan=0.0), -1.0, 1.0)"
