- name: fut_mkt_trend
  description: 市场趋势强度：R²衡量趋势强度。中信商品市场4因子之一。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 60))
        if n < window + 1:
            return np.zeros(n)
        # 市场趋势强度+方向：R² × 斜率符号
        # R² 衡量趋势强度，斜率符号决定方向（上涨=+，下跌=-）
        trend = np.zeros(n)
        for i in range(window, n):
            y = close[i-window+1:i+1]
            x = np.arange(window)
            if np.std(y) > 1e-10:
                r2 = np.corrcoef(x, y)[0, 1]**2
                slope_sign = np.sign(y[-1] - y[0])
                trend[i] = r2 * slope_sign
        sig = np.tanh(trend * 5)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 60
  input_fields:
  - close
  lookback: 65
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 3
    institutional: 3
    narrative: 市场趋势强度：R²衡量趋势强度。中信商品市场4因子之一。
- name: fut_mkt_speculation
  description: 市场投机度：成交量/持仓量。投机度高=情绪过热=做空。中信商品市场4因子之一。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
        hold = data['hold'].values if hasattr(data, 'hold') else data.get('hold', np.ones(len(close)))
        n = len(volume)
        window = int(params.get('window', 20))
        if n < window + 1:
            return np.zeros(n)
        # 市场投机度 = 成交量 / 持仓量
        turn = np.zeros(n)
        for i in range(1, n):
            turn[i] = volume[i] / max(hold[i], 1)
        avg = np.convolve(turn, np.ones(window)/window, mode='same')
        dev = (turn - avg) / np.maximum(avg, 1e-10)
        # 投机度高 => 情绪过热 => 做空
        sig = -np.tanh(dev * 3)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  - hold
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 4
    institutional: 3
    narrative: 市场投机度：成交量/持仓量。投机度高=情绪过热=做空。中信商品市场4因子之一。
- name: fut_mkt_rotation
  description: 市场轮动速度：高频波动/低频波动比。轮动快=风格切换频繁。中信商品市场4因子之一。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 20))
        if n < window * 2:
            return np.zeros(n)
        # 市场轮动速度：用品种间相关性变化率近似
        # 单品种内用高频波动 vs 低频波动比
        returns = np.zeros(n)
        returns[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)
        vol_high = np.array([np.std(returns[max(0, i-5+1):i+1]) for i in range(n)])
        vol_low = np.array([np.std(returns[max(0, i-window+1):i+1]) for i in range(n)])
        ratio = vol_high / np.maximum(vol_low, 1e-10)
        sig = np.tanh(ratio * 2)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 3
    institutional: 3
    narrative: 市场轮动速度：高频波动/低频波动比。轮动快=风格切换频繁。中信商品市场4因子之一。
- name: fut_mkt_concentration
  description: 成交集中度：成交额偏离度。成交集中=资金集中=趋势延续。中信商品市场4因子之一。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
        n = len(volume)
        window = int(params.get('window', 20))
        if n < window + 1:
            return np.zeros(n)
        # 成交集中度：用单个品种成交量占比的波动近似
        amount = close * volume
        ma = np.convolve(amount, np.ones(window)/window, mode='same')
        dev = (amount - ma) / np.maximum(ma, 1e-10)
        # 成交集中 => 资金集中 => 趋势延续
        sig = np.tanh(dev * 2)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - volume
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 4
    institutional: 3
    narrative: 成交集中度：成交额偏离度。成交集中=资金集中=趋势延续。中信商品市场4因子之一。

