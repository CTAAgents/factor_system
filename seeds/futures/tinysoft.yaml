- name: fut_norm_vwap_break
  description: 标准化均价突破因子：用波动率标准化的 VWAP 偏离，避免不同品种量级差异。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            high = data['high'].values if hasattr(data, 'high') else data['high']
            low = data['low'].values if hasattr(data, 'low') else data['low']
            volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            typical_price = (high + low + close) / 3
            vwap = np.convolve(typical_price * volume, np.ones(window), mode='same') / np.maximum(np.convolve(volume, np.ones(window), mode='same'), 1e-10)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            vol = np.zeros(n)
            for i in range(window, n):
                vol[i] = np.std(ret[i - window : i])
            break_dev = (close - vwap) / np.maximum(vwap, 1e-10)
            sig = np.zeros(n)
            for i in range(window, n):
                if vol[i] > 1e-10:
                    sig[i] = break_dev[i] / vol[i]
            sig = np.tanh(sig * 5)
            return np.clip(sig, -1.0, 1.0)
