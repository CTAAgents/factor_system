- name: fut_log_price_diff
  description: 主力对数价格差：合约价格的对数差分，衡量价格水平变化。价格越低=价值越高=做多。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 60))
            if n < window + 2:
                return np.zeros(n)
            log_p = np.log(np.maximum(close, 1e-10))
            # 价格偏离长期均值程度
            ma = np.convolve(log_p, np.ones(window) / window, mode='same')
            dev = ma - log_p
            # 价格越低(dev越大)越做多(均值回归)
            sig = np.tanh(dev * 3)
            return np.clip(sig, -1.0, 1.0)
