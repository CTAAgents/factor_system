- name: fut_ma_crossover
  description: 快慢均线偏离率：(快均线-慢均线)/慢均线，MACD 核心思想。快线上穿慢线=做多。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            fast = int(params.get('fast', 5))
            slow = int(params.get('slow', 20))
            if n < slow + 1:
                return np.zeros(n)
            ma_fast = np.convolve(close, np.ones(fast) / fast, mode='same')
            ma_slow = np.convolve(close, np.ones(slow) / slow, mode='same')
            dev = (ma_fast - ma_slow) / np.maximum(ma_slow, 1e-10)
            sig = np.tanh(dev * 20)
            return np.clip(sig, -1.0, 1.0)
