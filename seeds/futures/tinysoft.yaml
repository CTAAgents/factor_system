        def factor_program(data, params):
            import numpy as np
            high = data['high'].values if hasattr(data, 'high') else data['high']
            low = data['low'].values if hasattr(data, 'low') else data['low']
            open = data['open'].values if hasattr(data, 'open') else data['open']
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            if n < 5:
                return np.zeros(n)
            co = np.log(close / np.maximum(open, 1e-10))
            oc = np.log(open / np.maximum(np.roll(close, 1), 1e-10))
            oc[0] = 0
            hl = np.log(high / np.maximum(low, 1e-10))
            ho = np.log(high / np.maximum(open, 1e-10))
            hc = np.log(high / np.maximum(close, 1e-10))
            lo = np.log(low / np.maximum(open, 1e-10))
            lc = np.log(low / np.maximum(close, 1e-10))
            rs = ho * hc + lo * lc
            rs = np.clip(rs, 0, None)
            k = 0.34 / (1.34 + (window + 1) / (window - 1)) if window > 1 else 0.34
            window = int(params.get('window', 10))
            if n < window:
                return np.zeros(n)
            # 简化的 Yang-Zhang
            yz = np.zeros(n)
            for i in range(1, n):
                start = max(0, i - window + 1)
                seg_o = oc[start:i+1]
                seg_c = co[start:i+1]
                seg_rs = rs[start:i+1]
                yz[i] = np.var(seg_o) + 0.5 * np.var(seg_c) + 0.5 * np.mean(seg_rs)
            trend = np.gradient(yz)
            sig = np.tanh(trend * 100)
            return np.clip(sig, -1.0, 1.0)
