- name: fut_up_return_ratio
  description: 涨幅占比：过去 N 日内上涨收益占全部收益的比例，衡量上涨动能强度。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('lookback', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            ratio = np.zeros(n)
            for i in range(window, n):
                seg = ret[i - window : i]
                up_sum = np.sum(seg[seg > 0])
                total = np.sum(np.abs(seg))
                ratio[i] = up_sum / max(total, 1e-10)
            sig = (ratio - 0.5) * 2
            return np.clip(sig, -1.0, 1.0)
