        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('lookback', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = (close[window:] - close[:-window]) / np.maximum(close[:-window], 1e-10)
            sig = np.zeros(n)
            sig[window:] = np.tanh(ret / 0.05)
            return np.clip(sig, -1.0, 1.0)
