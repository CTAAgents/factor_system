- name: fut_overnight_trend
  description: 隔夜趋势因子：(开盘-前收盘)/前收盘，隔夜跳空方向。隔夜上涨=利多延续。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            open = data['open'].values if hasattr(data, 'open') else data['open']
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            if n < 3:
                return np.zeros(n)
            overnight = (open - np.roll(close, 1)) / np.maximum(np.roll(close, 1), 1e-10)
            overnight[0] = 0
            window = int(params.get('window', 5))
            avg_overnight = np.convolve(overnight, np.ones(window) / window, mode='same')
            sig = np.tanh(avg_overnight * 20)
            return np.clip(sig, -1.0, 1.0)
