- name: fut_cv2
  description: 变异系数因子2：标准差/均值，用滚动窗口末端的波动率替代均值，强调尾部波动。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 2:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            cv2 = np.zeros(n)
            for i in range(window, n):
                seg = close[i - window : i]
                seg_ret = ret[i - window : i]
                std_val = np.std(seg_ret)
                mean_val = np.mean(seg)
                cv2[i] = std_val / max(mean_val, 1e-10) if mean_val > 0 else 0
            sig = np.tanh((cv2 - np.mean(cv2)) / np.maximum(np.std(cv2), 1e-10))
            return np.clip(sig, -1.0, 1.0)
