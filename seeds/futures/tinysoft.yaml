        def factor_program(data, params):
            import numpy as np
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 20))
            if n < window + 3:
                return np.zeros(n)
            ret = np.diff(close) / np.maximum(close[:-1], 1e-10)
            vol = np.zeros(n)
            for i in range(window, n):
                vol[i] = np.std(ret[i - window : i])
            # 波动率变化方向
            vol_change = np.diff(vol)
            sig = np.zeros(n)
            sig[window+1:] = -np.tanh(vol_change[window-1:] * 100)
            return np.clip(sig, -1.0, 1.0)
