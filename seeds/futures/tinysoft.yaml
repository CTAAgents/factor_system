- name: fut_oi_growth
  description: 持仓量涨幅：持仓量的 N 日增长率。持仓快速增长=资金流入=趋势确认。
  market: futures
  code: |2

        def factor_program(data, params):
            import numpy as np
            hold = data['hold'].values if hasattr(data, 'hold') else data.get('hold', np.ones(len(close) if 'close' in data else 1))
            close = data['close'].values if hasattr(data, 'close') else data['close']
            n = len(close)
            window = int(params.get('window', 10))
            if n < window + 2:
                return np.zeros(n)
            oi_growth = (hold[window:] - hold[:-window]) / np.maximum(hold[:-window], 1e-10)
            sig = np.zeros(n)
            sig[window:] = np.tanh(oi_growth * 2)
            return np.clip(sig, -1.0, 1.0)
