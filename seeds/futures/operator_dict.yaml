- name: seed_trend_rsqr
  description: 趋势拟合优度：rsquare(close, 20)。来源：Qlib-RSQR20。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        if n < 21:
            return np.zeros(n)
        # 趋势拟合优度：rsquare(close, 20)
        x = np.arange(20)
        x_mean = x.mean()
        x_var = np.sum((x - x_mean) ** 2)
        rsqr = np.zeros(n)
        for i in range(19, n):
            y = close[i-19:i+1]
            y_mean = y.mean()
            slope = np.sum((x - x_mean) * (y - y_mean)) / (x_var + 1e-10)
            intercept = y_mean - slope * x_mean
            y_pred = slope * x + intercept
            ss_res = np.sum((y - y_pred) ** 2)
            ss_tot = np.sum((y - y_mean) ** 2)
            rsqr[i] = 1 - ss_res / (ss_tot + 1e-10)
        sig = np.tanh((rsqr - 0.5) * 4)
        return np.clip(sig, -1.0, 1.0)
