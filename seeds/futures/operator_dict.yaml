- name: seed_argmax_close
  description: 20日最高价新鲜度：argmax(close, 20) / 20。来源：WQ#1 / Qlib-IMAX20。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 20))
        if n < window + 1:
            return np.zeros(n)
        # 20日最高价新鲜度：argmax(close, 20) / 20
        sig = np.zeros(n)
        for i in range(window, n):
            seg = close[i-window+1:i+1]
            sig[i] = np.argmax(seg) / window
        return sig
