family: alpha_behavior
version: '1.0'
market: futures
factors:
- name: fut_time_series_regression
  description: 时序回归因子：close~time OLS 斜率，综合考虑趋势强度和流畅性(R²加权)。中信年化8.90%夏普1.34。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        j = int(params.get('lookback', 243))
        k = int(params.get('holding', 10))
        if n < j + k + 1:
            return np.zeros(n)
        # 时序回归：close ~ time 的 OLS 斜率，综合趋势强度和流畅性
        slope = np.zeros(n)
        r2 = np.zeros(n)
        for i in range(j, n):
            y = close[i-j+1:i+1]
            x = np.arange(j)
            if np.std(y) > 1e-10 and np.std(x) > 1e-10:
                slope[i] = np.corrcoef(x, y)[0, 1] * (np.std(y) / np.std(x))
                r2[i] = np.corrcoef(x, y)[0, 1]**2
        # R² 高的趋势更可靠
        quality = r2 * slope
        sig = np.tanh(quality * 100)
        return np.clip(sig, -1.0, 1.0)
  params:
    lookback: 120
    holding: 10
  input_fields:
  - close
  lookback: 120
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 3
    microstructure: 3
    institutional: 4
    narrative: 时序回归因子：close~time OLS 斜率，综合考虑趋势强度和流畅性(R²加权)。中信年化8.90%夏普1.34。
- name: fut_bias
  description: 乖离率因子(BIAS)：价格偏离均线的程度。正乖离=超买做空，负乖离=超卖做多。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        n = len(close)
        window = int(params.get('window', 20))
        if n < window + 1:
            return np.zeros(n)
        ma = np.convolve(close, np.ones(window)/window, mode='same')
        bias = (close - ma) / np.maximum(ma, 1e-10)
        # 正乖离(价格在均线上) => 超买 => 做空
        # 负乖离(价格在均线下) => 超卖 => 做多
        sig = -np.tanh(bias * 10)
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 4
    behavioral: 4
    microstructure: 3
    institutional: 3
    narrative: 乖离率因子(BIAS)：价格偏离均线的程度。正乖离=超买做空，负乖离=超卖做多。
- name: fut_gp_alpha1
  description: GP Alpha 1：遗传规划挖掘的截面alpha。近似(close-vwap)*volume/(high-low)。夏普1.72年化9.32%。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        high = data['high'].values if hasattr(data, 'high') else data['high']
        low = data['low'].values if hasattr(data, 'low') else data['low']
        volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
        n = len(close)
        if n < 30:
            return np.zeros(n)
        # GP Alpha 1 近似: (close - vwap) * volume / (high - low + 1e-10)
        vwap = np.convolve(close * volume, np.ones(5)/5, mode='same') / np.maximum(np.convolve(volume, np.ones(5)/5, mode='same'), 1e-10)
        hl = np.maximum(high - low, 1e-10)
        raw = (close - vwap) * volume / hl
        sig = np.tanh(raw / np.maximum(np.std(raw[30:]), 1e-10) * 3)
        return np.clip(sig, -1.0, 1.0)
  params: {}
  input_fields:
  - close
  - high
  - low
  - volume
  lookback: 30
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 4
    institutional: 3
    narrative: GP Alpha 1：遗传规划挖掘的截面alpha。近似(close-vwap)*volume/(high-low)。夏普1.72年化9.32%。
- name: fut_ht_alpha
  description: 华泰Alpha因子量价行为：日内强度+量价趋势+动量加速度三维组合。华泰期货Alpha因子。
  market: futures
  code: |2

    def factor_program(data, params):
        import numpy as np
        close = data['close'].values if hasattr(data, 'close') else data['close']
        high = data['high'].values if hasattr(data, 'high') else data['high']
        low = data['low'].values if hasattr(data, 'low') else data['low']
        volume = data['volume'].values if hasattr(data, 'volume') else data['volume']
        n = len(close)
        window = int(params.get('window', 20))
        if n < window * 2:
            return np.zeros(n)
        # 华泰 Alpha 因子近似：多维度量价行为组合
        ret = np.zeros(n)
        ret[1:] = (close[1:] - close[:-1]) / np.maximum(close[:-1], 1e-10)
        # 维度1: 日内强度 (close-low)/(high-low)
        hl = np.maximum(high - low, 1e-10)
        intraday = (close - low) / hl
        # 维度2: 量价趋势
        vwap = np.convolve(close * volume, np.ones(5)/5, mode='same') / np.maximum(np.convolve(volume, np.ones(5)/5, mode='same'), 1e-10)
        vp_trend = (close - vwap) / np.maximum(vwap, 1e-10)
        # 维度3: 动量加速度
        mom = np.zeros(n)
        mom[window:] = (close[window:] - close[:-window]) / np.maximum(close[:-window], 1e-10)
        accel = np.zeros(n)
        for i in range(window, n):
            accel[i] = mom[i] - mom[i-1] if i > 0 else 0
        # 综合
        sig = (intraday - 0.5) * 0.3 + np.tanh(vp_trend * 5) * 0.3 + np.tanh(accel * 50) * 0.4
        return np.clip(sig, -1.0, 1.0)
  params:
    window: 20
  input_fields:
  - close
  - high
  - low
  - volume
  lookback: 25
  output_type: signal
  frequency: daily
  economic_logic:
    theory: 3
    behavioral: 4
    microstructure: 4
    institutional: 3
    narrative: 华泰Alpha因子量价行为：日内强度+量价趋势+动量加速度三维组合。华泰期货Alpha因子。

